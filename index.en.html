 ov:{id:'ov',title:'Public transport policy: from vision to concession',domain:'ov',cover:'cov-ov',dur:'45 min',required:false,blended:true,
  intro:'How do you turn a public transport vision into concrete requirements and a clear advisory memo? Five short lessons with exercises, a role play and two missions.',
  lessons:[
   {t:'Who does what in public transport?',body:`<p>Three parties work together in urban and regional transport. The <b>province</b> is the concession authority: it tenders the bus services and sets the programme of requirements. The <b>operator</b> runs the timetable within the concession. The <b>municipality</b> is responsible for public space: stops, traffic flow, bicycle parking at hubs and the spatial development that generates passengers.</p>
<div class="callout">As a municipality you therefore have no formal say over the timetable, but you do have a lot of influence: through your input on the programme of requirements, through infrastructure, and through consultation at executive level.</div>
<p>Good public transport policy officers know this division of roles exactly, so that they address their advice to the party that really decides.</p>`,
    quiz:{q:'Who sets the programme of requirements for a bus concession?',o:['The municipality','The province','The operator'],c:1,e:'The province is the concession authority and sets the programme of requirements. The municipality provides input for it.'}},
   {t:'From public transport vision to programme of requirements',body:`<p>A public transport vision describes what you want to achieve, for example: "Every neighbourhood within a 10-minute walk of a stop with at least a service every 15 minutes." A programme of requirements makes that measurable and enforceable.</p>
<ul><li><b>Vision:</b> direction and ambition, for the executive board.</li><li><b>Municipal input:</b> concrete wishes per corridor or neighbourhood, with supporting evidence.</li><li><b>Programme of requirements:</b> measurable requirements, such as frequency, service hours, accessibility and emissions.</li></ul>
<p>The key is to phrase ambitions so that the province can adopt them: specific, measurable and with a clear benefit for passengers.</p>`,
    quiz:{q:'Which wording is most usable as input for a programme of requirements?',o:['Public transport in Breda-Noord needs to improve.','Line Breda-Noord: at least every 15 minutes between 7:00 and 19:00 on weekdays.','We want an attractive and sustainable public transport network.'],c:1,e:'Only the second is specific and measurable. The other two are ambitions that belong in a vision.'}},
   {t:'Supporting your case with passenger data',body:`<p>A request carries more weight when you support it with evidence. Look at boardings and alightings per stop, travel times, and where new homes are being built. Below is a fictional example of a corridor.</p>
<table class="datatable num"><tr><th>Stop (fictional)</th><th>Boardings/day</th><th>Growth '24–'26</th><th>New homes until 2030</th></tr>
<tr><td>Station Noord</td><td>1,840</td><td>+12%</td><td>650</td></tr>
<tr><td>Wijkcentrum Haagse Beemden</td><td>920</td><td>+4%</td><td>120</td></tr>
<tr><td>Bedrijventerrein Hazeldonk</td><td>410</td><td>+21%</td><td>0</td></tr></table>
<p>Note: growth in percentages says little without the absolute numbers. And housing plans are a forecast, not a certainty. Say so honestly in your memo.</p>`,
    quiz:{q:'Which conclusion is best supported by the table?',o:['Hazeldonk has the most passengers.','Station Noord has many passengers and the most new homes, so extra capacity there is the easiest to justify.','Haagse Beemden can do without a bus connection.'],c:1,e:'Station Noord combines the highest number of boardings with the largest housing development. Hazeldonk is growing fast, but from a low base.'}},
   {t:'Weighing interests',body:`<p>Public transport choices affect several interests at once: <b>accessibility</b> (fast, frequent lines), <b>inclusion</b> (keeping older people and small villages connected), <b>costs</b> (operating cost per passenger) and <b>sustainability</b>. These interests often clash: a fast, straight line serves fewer streets.</p>
<div class="callout">Council members often ask: "Who loses out?" Make sure you have that answer ready, with numbers.</div>
<p>Practise this with the Copilot: choose <b>Practise a conversation</b> and let a critical council member question you.</p>`,
    quiz:{q:'A council member asks: "Who loses out if we straighten the line?" What is the strongest answer?',o:['Nobody, everyone benefits.','About 300 residents in two streets will have a longer walking distance (from 300 to 550 metres); in return, 2,100 passengers per day save 6 minutes of travel time.','You will have to ask the province.'],c:1,e:'An honest answer with numbers and the trade-off makes your advice credible.'}},
   {t:'A clear advisory memo',body:`<p>A good advisory memo for the executive board (college) and council starts with the core: what is being asked, what is your advice and why. Write in B1 plain language, use short sentences and put numbers in a table.</p>
<ul><li><b>Decision point</b> in one sentence.</li><li><b>Background</b> in five lines at most.</li><li><b>Trade-off</b> with the interests from lesson 4.</li><li><b>What does this mean for residents?</b> Concrete and honest.</li></ul>
<p>Paste a paragraph from your own memo into the Copilot and choose <b>Check my text</b>.</p>`,
    quiz:{q:'What does a good advisory memo start with?',o:['A detailed description of the history of the file','The decision point and your advice','An overview of all parties involved'],c:1,e:'Decision-makers read the core first. Start with what has to be decided and what you recommend.'}}
  ],
  prompts:['Explain this simply','Quiz me','Apply to my work','Practise a conversation','Check my text','What suits me?'],
  roleplay:'a critical council member from an opposition party who is worried about residents in small villages'},
 ai:{id:'ai',title:'Working with Copilot and AI',domain:'ai',cover:'cov-ai',dur:'30 min',required:false,blended:false,
  intro:'Use AI responsibly and smartly in policy work: what can it do, what is allowed, and how do you write good prompts?',
  lessons:[
   {t:'What is generative AI, and what is it not?',body:`<p>Generative AI, such as Copilot, predicts text based on patterns. It is strong at summarising, rewriting, structuring and thinking along. It is <b>not</b> a source of truth: it can make up facts that sound convincing.</p><div class="callout">Rule of thumb: use AI as a sparring partner, not as a source. Always check figures, laws and quotes yourself.</div>`,
    quiz:{q:'Copilot cites a legal article you don\'t know. What do you do?',o:['Use it as is, because AI is usually correct','Look the article up and check it yourself','Ask Copilot whether it is sure'],c:1,e:'AI can invent sources. Always check yourself in the official source, for example wetten.overheid.nl.'}},
   {t:'Writing good prompts',body:`<p>A good prompt has four parts: <b>role</b> (who the AI should be), <b>task</b> (what should happen), <b>context</b> (background, target audience) and <b>format</b> (length, structure).</p><p>Example: "You are an experienced policy adviser. Summarise this memo for an alderman in five bullets, in B1 plain language."</p>`,
    quiz:{q:'Which parts are missing from the prompt "Summarise this text"?',o:['Only the role','Role, context and format','Nothing, it is complete'],c:1,e:'The task is there, but role, context (for whom?) and format (how long, what structure?) are missing.'}},
   {t:'What is and is not allowed?',body:`<p>Only use the AI tools that the municipality has approved. Never paste personal data (names, citizen service numbers, residents\' addresses) or confidential documents into an AI tool that is not set up for that. Mention it if AI made a substantial contribution to a document.</p>`,
    quiz:{q:'May you paste a complaint letter with a resident\'s name and address into a public AI chatbot?',o:['Yes, if you delete the letter afterwards','No, that is personal data','Yes, if it is for your work'],c:1,e:'Personal data does not belong in AI tools that are not approved for it. Anonymise first or use the approved environment.'}},
   {t:'AI as a sparring partner',body:`<p>Let AI look for counterarguments, read your text critically or simulate a tough question from a council member. You remain responsible for the judgement.</p><p>Try it: ask the Copilot for three counterarguments to a proposal you are working on now.</p>`,
    quiz:{q:'Who is responsible for advice written with the help of AI?',o:['The AI supplier','You, as the author','Nobody'],c:1,e:'The author remains responsible for the content and the trade-offs.'}}
  ],
  prompts:['Explain this simply','Quiz me','Apply to my work','Check my text','What suits me?'],
  roleplay:'a colleague who doubts whether AI may be used at all'},
 sec:{id:'sec',title:'Working securely: recognising phishing',domain:'sec',cover:'cov-sec',dur:'20 min',required:true,deadline:'15 Oct 2026',blended:false,
  intro:'Mandatory module. Learn to recognise phishing, know what to do when in doubt, and report suspicious emails.',
  lessons:[
   {t:'Why phishing works',body:`<p>Phishing plays on haste, curiosity and authority. An email saying your parcel cannot be delivered or that your password expires today puts you under pressure. We click faster precisely when we are busy.</p>`,
    quiz:{q:'Why does phishing often work on busy employees?',o:['Busy people read less email','Under time pressure we check less carefully','Phishing is only sent on busy days'],c:1,e:'Time pressure makes us act faster and less critically.'}},
   {t:'Six warning signs',body:`<ul><li><b>Sender:</b> is the domain exactly right? (e.g. breda-servicedesk.net instead of breda.nl)</li><li><b>Urgency:</b> "within 24 hours", "final warning".</li><li><b>Link:</b> hover over it without clicking. Where does it really lead?</li><li><b>Greeting:</b> "Dear user" instead of your name.</li><li><b>Request:</b> for login details, payment or to open an attachment.</li><li><b>Language and style:</b> slightly different from normal.</li></ul>`,
    quiz:{q:'Which sender is the most suspicious?',o:['servicedesk@breda.nl','servicedesk@breda-servicedesk.net','m.janssen@breda.nl'],c:1,e:'The domain breda-servicedesk.net looks like the municipality, but it is not.'}},
   {t:'Unsure, or already clicked?',body:`<p>If you are unsure: don\'t click, but report the email with the <b>Report phishing</b> button. Already clicked or entered something? Report it straight away to the service desk. There is no shame in that: the sooner you report, the smaller the damage.</p>`,
    quiz:{q:'You accidentally entered your password on a suspicious page. What do you do first?',o:['Say nothing and hope for the best','Report it to the service desk immediately and change your password','Ask about it tomorrow'],c:1,e:'Reporting quickly limits the damage. Nobody will blame you for this.'}},
   {t:'Reporting is good',body:`<p>Every report helps your colleagues: Information Security can then block the email for everyone. Practise with the demo inbox under <b>Working securely</b>. You earn XP for every correct report.</p>`,
    quiz:{q:'What happens to a reported phishing email?',o:['Nothing','Information Security can block it for everyone','You get a warning'],c:1,e:'One report can protect hundreds of colleagues.'}}
  ],
  prompts:['Explain this simply','Quiz me','Is this phishing?','What suits me?'],
  roleplay:'a scammer posing as the IT service desk; afterwards you explain which signals the employee could have spotted'},

<script>
/* ============ STATE ============ */
const LS_KEY='lab-demo-v1';
let S;
try{ const raw=localStorage.getItem(LS_KEY); S=raw?JSON.parse(raw):null; }catch(e){ S=null; }
if(!S||!S.users) S=initialState();
S.pop=null; S.modal=null;
Object.values(S.copilot||{}).forEach(c=>{c.busy=false});
function save(){ try{ const c=JSON.parse(JSON.stringify(S)); localStorage.setItem(LS_KEY,JSON.stringify(c)); }catch(e){} }
const U=()=>S.users[S.user];

let SAMPLE; // undefined = loading, null = unavailable
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('sample').then(s=>{SAMPLE=s||null; if(S.view==='module') render();}).catch(()=>{SAMPLE=null; if(S.view==='module') render();});
} else { SAMPLE=null; }

/* ============ HELPERS ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lvl(x){ let i=0; LEVELS.forEach((l,k)=>{ if(x>=l.x) i=k; }); const next=LEVELS[i+1]; const pct=next?Math.round((x-LEVELS[i].x)/(next.x-LEVELS[i].x)*100):100; return {i,name:LEVELS[i].n,next,pct}; }
const totalXP=u=>Object.values(u.xp).reduce((a,b)=>a+b,0);
function av(id,name,size){ const ini=(name||'?').split(' ').filter(w=>w[0]===w[0].toUpperCase()).map(w=>w[0]).slice(0,2).join(''); return `<span class="avatar"${size?` style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.6)}px"`:''} aria-hidden="true">${esc(ini)}</span>`; }
const teamName=id=>(TEAM.find(t=>t.id===id)||{}).n||S.users[id]?.n||id;

 const flush=()=>{ if(para.length){ out+=`<p>${inl(para.join('<br>'))}</p>`; para=[]; } };
 lines.forEach(l=>{
  const b=l.match(/^\s*[-*•]\s+(.*)/), n=l.match(/^\s*\d+[.)]\s+(.*)/), h=l.match(/^#{1,4}\s+(.*)/);
  if(b||n){ flush(); const k=b?'ul':'ol'; if(list!==k){ close(); out+=`<${k}>`; list=k; } out+=`<li>${inl((b||n)[1])}</li>`; }
  else if(h){ flush(); close(); out+=`<p><b>${inl(h[1])}</b></p>`; }
  else if(!l.trim()){ flush(); close(); }
  else { close(); para.push(l); }
 });
 flush(); close(); return out;
}

   <div class="content">${L.body}</div>

    ${L.quiz.o.map((o,i)=>`<button class="opt ${ans!=null?(i===L.quiz.c?'right':i===ans?'wrong':''):''}" data-a="quiz" data-v="${i}" ${ans!=null?'disabled':''}><span class="st">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}
    ${ans!=null?`<div class="fb">${ans===L.quiz.c?'<b style="color:var(--ok)">Correct.</b> ':'<b style="color:var(--bad)">Not quite.</b> '}${esc(L.quiz.e)} <button class="btn ghost sm" data-a="quizreset">Try again</button></div>`:''}</div>
   <div class="row between" style="margin-top:18px"><button class="btn" data-a="lesson" data-v="${li-1}" ${li===0?'disabled':''}>Previous lesson</button>

  </section>

 </div>`; }
function cop(mid){ if(!S.copilot[mid]) S.copilot[mid]={turns:[],busy:false}; return S.copilot[mid]; }
function copilotPanel(m){ const c=cop(m.id+'-'+S.user); const avail=SAMPLE!==null;
 return `<aside class="copilot" aria-label="Learning Copilot"><div class="cop-h"><span class="cop-logo">${icon('spark',16)}</span><div class="grow"><b>Learning Copilot</b><span>Helps with this module · ${esc(m.title)}</span></div>${c.turns.length?'<button class="btn ghost sm" data-a="copclear">New conversation</button>':''}</div>
  <div class="cop-body" id="cop-body">${copBody(c,m)}</div>
  ${avail?`<div class="cop-prompts">${(S.promptLib?.[m.id]||m.prompts).map(p=>`<button data-a="copprompt" data-v="${esc(p)}" ${c.busy?'disabled':''}>${esc(p)}</button>`).join('')}</div>
  <form class="cop-in" data-form="cop"><textarea id="cop-input" placeholder="Ask a question about the lesson or paste a piece of your own text…" aria-label="Message to Copilot" ${c.busy?'disabled':''}></textarea>
   <div class="row between"><span class="cop-disc">AI can make mistakes. Do not paste personal data.</span>${c.busy?`<button type="button" class="btn sm" data-a="copstop">${icon('stop',14)} Stop</button>`:`<button class="btn sm primary" type="submit">${icon('send',14)} Send</button>`}</div></form>`
  :`<div class="cop-in"><div class="notice warn small">${SAMPLE===undefined?'Loading Copilot…':'The AI Copilot is switched off in this online demo. The rest of the demo works as normal.'}</div></div>`}
 </aside>`; }
function copBody(c,m){ if(!c.turns.length) return `<div class="msg a"><p>Hi ${esc(U().n.split(' ')[0])}. I'm here to help with <b>${esc(m.title)}</b>. You can ask me questions about the lesson, have me quiz you, practise a conversation or apply the material to your own work.</p><p>Pick a button below or type a question yourself.</p></div>`;
 return c.turns.map((t,i)=>t.role==='user'?`<div class="msg u">${esc(t.show||t.content)}</div>`:`<div class="msg a">${md(t.content)}${t.err?`<p class="small" style="color:var(--bad)">${esc(t.err)}</p>`:''}<div class="acts"><button data-a="copfb" data-v="${i}" data-k="up" class="${t.fb==='up'?'on':''}">Helpful</button><button data-a="copfb" data-v="${i}" data-k="down" class="${t.fb==='down'?'on':''}">Not helpful</button><button data-a="copcopy" data-v="${i}">Copy</button></div></div>`).join('')
  + (c.busy?`<div class="msg a" id="cop-stream"><span class="thinking"><i></i><i></i><i></i></span> <span class="small muted">Copilot is thinking…</span></div>`:''); }
const PROMPT_INSTR={
 'Explain this simply':'Explain the current lesson in plain, simple English (roughly B1 level), with one concrete example from municipal practice. Maximum 150 words.',
 'Quiz me':'Quiz me on the current lesson. Ask one practice question at a time (open or multiple choice). Wait for my answer, then give a short explanation and ask the next question. 3 questions in total, then a short summary of what went well.',
 'Apply to my work':'Help me apply the material from the current lesson to my own work. Start with one short question about what I am currently working on (use what you already know about my role). Then give 2-3 concrete, practical suggestions.',
 'Practise a conversation':'Start a role play. You play {ROLE}. Begin straight away in your role with one critical, realistic question to me. Ask one question at a time and stay in role. When I type "stop", step out of your role and give feedback in 3 points based on the lesson material.',
 'Check my text':'I want feedback on a text of my own. First ask me to paste the text (without personal data). Then give feedback based on the lesson material: does it lead with the key point, is it B1 level, is it well-founded and honest? Provide an improved version of at most 5 sentences.',
 'What suits me?':'Give me personal learning advice based on my role and growth path: choose exactly one module, one mission and one community from the lists below, with one sentence per choice explaining why. Short and concrete.',
 'Is this phishing?':'Help me assess whether an email is phishing. First ask me to describe the email: sender, subject, what is being asked and whether it contains a link or attachment. Then go through the six warning signs from lesson 2 and give a clear recommendation (report it or not).'
};
function strip(h){ return h.replace(/<tr>/g,'\n').replace(/<\/t[dh]>/g,' | ').replace(/<li>/g,'\n- ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim(); }
function rules(m,li){ const u=U(); const lib=S.promptLib?.[m.id]||m.prompts;
 return `You are the Learning Copilot of Leer Academie Breda, the learning platform of the municipality of Breda. You sit alongside an e-learning module and help employees learn and apply the material in their work.
Rules:
- Always answer in clear, plain English at B1 level. Keep it short: usually 60-150 words, short paragraphs or bullet lists.
- Base explanations on the lesson material below and say which lesson something comes from ("From lesson 3: ..."). If something is not in the lesson material, say so and give general explanation with a caveat.
- Do not invent legal articles, figures or sources. The figures in the lesson material are fictional sample data.
- Never ask for personal data. If the user pastes names, addresses or citizen service numbers (BSN) of residents, warn them kindly and continue without that data.
- You do not assess employees for HR purposes and share nothing with managers. Be encouraging and concrete.
- This is a demo with fictional people; stay realistic and professional.

User: ${u.n}, ${u.f}, team ${u.team}.${u.id==='sanne'?' Is working on the Breda public transport vision and a council proposal about it (deadline in six weeks), and on the municipality\'s input for the new bus concession.':''}
Growth path: ${Object.entries(u.xp).map(([d,x])=>`${DOMAINS[d]} ${lvl(x).name} (${x} XP)`).join('; ')}.

Module: ${m.title}. The user is currently in lesson ${li+1}: "${m.lessons[li].t}".
Lesson material:
${m.lessons.map((l,i)=>`Lesson ${i+1}: ${l.t}\n${strip(l.body)}`).join('\n\n')}

Available modules: ${Object.values(MODULES).map(x=>x.title).join('; ')}.
Missions: ${MISSIONS.map(x=>`${x.t} (${x.task})`).join('; ')}.
Communities: ${COMMUNITIES.map(x=>x.n).join('; ')}.
Buttons in this module: ${lib.join(', ')}.`; }
let copCtl=null;
async function askCopilot(text,show){ const m=MODULES[S.params.id]; const u=U(); const li=S.params.l??u.progress[m.id].cur; const c=cop(m.id+'-'+S.user); if(c.busy||!SAMPLE) return;
 c.turns.push({role:'user',content:text,show}); c.busy=true; render();
 const turns=c.turns.slice(-14).map(t=>({role:t.role,content:t.content})); while(turns.length&&turns[0].role!=='user') turns.shift();
 const input=[{role:'user',content:rules(m,li)},...turns];
 copCtl=new AbortController(); const el=()=>document.getElementById('cop-stream');
 try{
  const {text:out,truncated}=await SAMPLE(input,{cache:false,signal:copCtl.signal,onText:({text})=>{const e=el(); if(e){ e.innerHTML=md(text); const b=document.getElementById('cop-body'); if(b) b.scrollTop=b.scrollHeight; }}});
  c.turns.push({role:'assistant',content:out+(truncated?'\n\n*(Answer shortened. Ask for less at a time.)*':'')});
 }catch(e){
  const map={not_granted:'You have not granted the Copilot permission. Reload the page to try again.',rate_limited:'It is a bit busy right now. Please try again in a minute.',refused:'I cannot help with that. Try phrasing your question differently.',session_expired:'Your session has expired. Please sign in to Claude again.',prompt_too_large:'The conversation has become too long. Start a new conversation.',sampling_disabled:'The Copilot is not available for this account.'};
  if(e&&e.code==='cancelled'){ c.turns.push({role:'assistant',content:(e.text||'')+(e.text?'\n\n':'')+'*(Stopped)*'}); }
  else c.turns.push({role:'assistant',content:e?.text||'',err:map[e?.code]||'Something went wrong with the Copilot. Please try again.'});
  if(e&&['not_granted','sampling_disabled','capability_disabled','not_declared'].includes(e.code)) SAMPLE=null;
 }
 c.busy=false; copCtl=null; save(); if(S.view==='module') render();
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');
 if(!t){ if(S.pop && !e.target.closest('.pop')){ S.pop=null; render(); } return; }
 const a=t.dataset.a, v=t.dataset.v, u=U();
 if(a==='modalbg'){ if(e.target===t){ S.modal=null; render(); } return; }
 switch(a){
  case 'go': go(v,t.dataset.p?{p:t.dataset.p}:{}); break;
  case 'pop': S.pop=S.pop===v||!v?null:v; render(); break;
  case 'signal': { const s=u.signals.find(x=>String(x.id)===v); if(s){ s.read=true; const [vw,p]=s.go||['home']; if(vw==='module') go('module',{id:p}); else if(vw==='community') go('community',{id:p}); else go(vw,p?{p}:{}); } break; }
  case 'readall': u.signals.forEach(s=>s.read=true); save(); render(); break;
  case 'reset': try{localStorage.removeItem(LS_KEY);}catch(_){} S=initialState(); render(); note('Demo reset','All accounts are back to their initial state.'); break;
  case 'open': go('module',{id:v}); break;
  case 'filter': go('aanbod',{f:v}); break;
  case 'lesson': { const i=+v; if(i<0) return; S.params.l=i; u.progress[S.params.id].cur=i; save(); render(); window.scrollTo(0,0); break; }
  case 'quiz': { const m=MODULES[S.params.id]; const li=S.params.l??u.progress[m.id].cur; const k=`${u.id}-${m.id}-${li}`; const i=+v; const first=!(k in S.quizAns)&&!S.quizAns[k+'-tried']; S.quizAns[k]=i; if(i===m.lessons[li].quiz.c&&first){ addXP(m.domain,5,'Correct practice question on the first try'); } S.quizAns[k+'-tried']=true; save(); render(); break; }
  case 'quizreset': { const m=MODULES[S.params.id]; const li=S.params.l??u.progress[m.id].cur; delete S.quizAns[`${u.id}-${m.id}-${li}`]; render(); break; }

   if(p.done.length>=m.lessons.length){ setTimeout(()=>toast('Module completed',m.required?'Your certificate has been registered.':'Great work!','plain'),300); if(m.id==='sec'&&u.id==='sanne'){ S.team.challenge.pctMod=Math.min(100,Math.round(secDoneCount()/9*100)); u.signals=u.signals.filter(s=>!/recogni[sz]ing phishing|phishing herkennen/.test(s.t)); } }
   else { p.cur=Math.min(li+1,m.lessons.length-1); S.params.l=p.cur; } save(); render(); window.scrollTo(0,0); break; }

  case 'mission': S.modal=['mission',v]; render(); break;

  case 'btab': go('beheer',{p:v}); break;
  case 'cmod': go('beheer',{p:'content',m:v}); break;
  case 'community': go('community',{id:v}); break;
  case 'like': S.team.feed[+v].likes++; save(); render(); break;
  case 'feedback': S.modal=['feedback',+v]; render(); break;
  case 'remind': note('Reminder sent',`${teamName(v)} will receive a notification in the Leer Academie.`); if(v==='sanne') addSignal('sanne','signaal','Reminder from Mark: complete the mandatory phishing module before 15 Oct',['module','sec']); save(); break;
  case 'event': { const ev=S.community.ov.events[+v]; ev.me=!ev.me; ev.going+=ev.me?1:-1; save(); render(); if(ev.me) note('Registered',`${ev.t} · ${ev.when}. A calendar invitation will follow (in the real version via Outlook).`); break; }
  case 'mailsel': { S.inboxSel=v; const m=u.inbox.find(x=>x.id===v); if(m) m.read=true; save(); render(); break; }
  case 'report': { const m=u.inbox.find(x=>x.id===v); if(!m||m.reported) return; m.reported=true;
   if(m.phish){ u.phishReports++; addXP('sec',25,'Suspicious email reported'); S.team.challenge.reports++; const r=campaignRes(); r.report++; S.campaigns.find(c=>c.id==='c1').res=r;
     if(u.phishReports>=3) badge('phish'); else setTimeout(()=>toast('Well spotted! This was a practice email.',`Phishing Detective badge: ${u.phishReports}/3`),700);
     if(u.missions['M-04']!=='afgerond'){ u.missions['M-04']='afgerond'; setTimeout(()=>addXP('sec',50,'Mission “Report it!” completed'),1400); } }
   else note('Report received','Information Security will look into it. This email was genuine, but reporting when in doubt is always good.');
   save(); render(); break; }
  case 'lure': { S.lure=v; const r=campaignRes(); r.click++; S.campaigns.find(c=>c.id==='c1').res=r; save(); render(); window.scrollTo(0,0); break; }
  case 'lureclose': S.lure=null; render(); break;
  case 'copprompt': { const m=MODULES[S.params.id]; askCopilot(`[Button: ${v}] ${(PROMPT_INSTR[v]||v).replace('{ROLE}',m.roleplay||'a critical sparring partner')}`,v); break; }
  case 'copstop': copCtl?.abort(); break;
  case 'copclear': { const c=cop(S.params.id+'-'+S.user); c.turns=[]; save(); render(); break; }
  case 'copfb': { const c=cop(S.params.id+'-'+S.user); const tr=c.turns[+v]; tr.fb=t.dataset.k; S.copFeedback=S.copFeedback||{up:41,down:7}; S.copFeedback[t.dataset.k]++; save(); render(); break; }
  default: if(window.wsClick) wsClick(a,v,t,e); break;
  case 'copcopy': { const c=cop(S.params.id+'-'+S.user); const txt=c.turns[+v].content; if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>note('Copied')).catch(()=>note('Copy failed','Select the text manually.')); break; }
 }
});
document.addEventListener('change',e=>{ const t=e.target; const k=t.dataset.change; if(!k) return;
 if(k==='acct'){ S.user=t.value; S.view='home'; S.params={}; S.lure=null; S.inboxSel=null; save(); render(); note(`Logged in as ${U().n}`,U().f); }
 if(k==='calm'){ S.calm=t.checked; save(); }
 if(k==='share'){ U().share=t.checked; save(); }
});

 box.innerHTML=(hits.length||kb.length)?`<div class="notice small"><b>${icon('spark',14)} Copilot found something similar:</b><ul style="margin:4px 0 0;padding-left:18px">${hits.map(h=>`<li>Question: ${esc(h.t)}${h.ans.some(a=>a.best)?' (has a best answer)':''}</li>`).join('')}${kb.map(k=>`<li>Knowledge base: ${esc(k.t)}</li>`).join('')}</ul></div>`:''; } });

 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cop-input'){ e.preventDefault(); e.target.form.requestSubmit(); } });

 if(k==='search'){ go('aanbod',{q:val('q')}); }
 if(window.wsSubmit&&wsSubmit(k,f,val)) return;

  if(who){ note('Feedback requested',`${teamName(who)} receives a task to give feedback.`); }
  if(u.share) S.team.feed.unshift({who:u.id,t:`Mission “${m.t}” completed. ${val('r2')}`,when:'just now',likes:0,kind:'missie'});
  if(id==='M-01'&&u.id==='sanne'){ S.team.goal.done=Math.min(S.team.goal.of,S.team.goal.done+1); }
  save(); render(); }
 if(k==='feedback'){ S.modal=null; addXP('ov',20,'Feedback given to a colleague'); save(); render(); note('Feedback sent',`${teamName(S.team.feed[+f.dataset.v].who)} can see your feedback on her mission.`); }
 if(k==='post'){ const x=val('post-text'); if(!x) return; S.team.feed.unshift({who:u.id,t:x,when:'just now',likes:0,kind:'tip'}); document.getElementById('post-text').value=''; save(); render(); }
 if(k==='minute'){ S.team.minutes.items.unshift({when:'today',q:[val('m1'),val('m2'),val('m3')]}); S.team.feed.unshift({who:u.id,t:`Learning minute: ${val('m2')} Next time: ${val('m3')}`,when:'just now',likes:0,kind:'leerminuut'}); save(); render(); note('Learning minute recorded','The lessons are in the team feed.'); }
 if(k==='recommend'){ const mod=val('rm'); const kind=val('rk'); const who=[...f.querySelectorAll('input[name=who]:checked')].map(x=>x.value); if(!who.length) return note('Select at least one team member');
  who.forEach(w=>{ if(w==='sanne'){ S.recommendations=S.recommendations.filter(r=>!(r.to==='sanne'&&r.mod===mod)); S.recommendations.push({to:'sanne',mod,by:'Mark Janssen',msg:val('rmsg')}); addSignal('sanne',kind==='toewijzen'?'taak':'signaal',`Mark has ${kind==='toewijzen'?'assigned':'recommended'} “${MODULES[mod].title}” to you`,['module',mod]); } });
  save(); note(kind==='toewijzen'?'Assigned':'Recommended',`${MODULES[mod].title} → ${who.length} team members. They will receive a notification.`); }
 if(k==='prompts'){ const mid=f.dataset.v; S.promptLib=S.promptLib||{}; S.promptLib[mid]=[...f.querySelectorAll('input[name=pr]:checked')].map(x=>x.value); save(); note('Published',`The Copilot buttons of ${MODULES[mid].title} have been updated.`); }
 if(k==='campaign'){ const tpl=val('ct'); const tg=val('cg'); const T=CAMPAIGN_TEMPLATES[tpl]; let c=S.campaigns.find(c=>c.id==='c1'); c.tpl=tpl; c.target=tg; c.status='actief'; c.when='today'; c.res={sent:9,open:4,click:1,report:2};
  ['sanne','mark'].forEach(uid=>{ const ib=S.users[uid].inbox; if(!ib.some(m=>m.phish)) ib.unshift({id:'p'+Date.now()+uid,from:T.from,addr:T.addr,subj:T.subj,time:'just now',read:false,phish:tpl,body:T.body}); });
  save(); render(); note('Campaign sent',`The practice email is now in the inbox of ${tg}. Switch to Sanne and open Working securely.`); }
});

<script>
/* ============ WORKSPACES (shared: db + room) ============ */
const WS_DEFAULTS={
 'ws/inbreng':{title:'Input for West-Brabant bus concession',desc:'Working together on Breda\'s input for the programme of requirements.',community:'ov',members:['Sanne de Vries','Iris van Dijk','Noor Bakker','Ruben Koster'],created:'20 Sep 2026'},
 'wsdoc/inbreng':{title:'Municipality of Breda input – draft v0.3',updatedBy:'Iris van Dijk',updatedAt:0,html:`<h1>Municipality of Breda input for the West-Brabant bus concession</h1><p><i>Draft v0.3 · Mobility &amp; Accessibility working group · fictitious demo content</i></p><h2>1. Decision point</h2><p>The municipal executive adopts Breda's input for the programme of requirements of the new bus concession and submits it to the province.</p><h2>2. Core of our input</h2><ul><li>A bus at least every 15 minutes on the North and East corridors, on weekdays between 7:00 and 19:00.</li><li>Small villages remain accessible with at least an hourly service or a good alternative, such as a neighbourhood bus or demand-responsive transport.</li><li>All stops on the main lines are accessible.</li><li>Zero-emission buses from the start of the concession.</li></ul><h2>3. Substantiation</h2><p>Station Noord has over 1,800 boardings per day and the largest housing development task up to 2030 (650 homes). The Hazeldonk business park is growing fast (+21%), but from a low base.</p><h2>4. Trade-offs</h2><p>[Iris: elaborate the trade-off between fast lines and accessibility of small villages here.]</p><h2>5. What does this mean for residents?</h2><p>[To be completed]</p>`},
 'wsslides/inbreng':{title:'Pitch to PT steering group – 14 Oct',slides:[
  {title:'Breda input – West-Brabant bus concession',body:'<p>PT steering group · 14 October 2026</p><p>Team Mobility &amp; Accessibility</p>'},
  {title:'What are we asking for?',body:'<ul><li>A bus every 15 minutes on the North and East corridors</li><li>Small villages remain accessible</li><li>Accessible stops on the main lines</li><li>Zero emission from day 1</li></ul>'},
  {title:'Why?',body:'<ul><li>Station Noord: 1,840 boardings per day (+12%)</li><li>650 new homes up to 2030</li><li>Hazeldonk is growing fast (+21%)</li></ul>'},
  {title:'What does the municipality do itself?',body:'<ul><li>Improve traffic flow at intersections</li><li>Bicycle parking at hubs</li><li>Make stops accessible</li></ul>'}]},
 'wsboard/inbreng':{title:'Brainstorm: reachability of small villages',notes:{
  n1:{x:40,y:70,text:'Neighbourhood bus for Teteringen and Ulvenhout',color:'yellow',votes:3,by:'Iris van Dijk'},
  n2:{x:225,y:70,text:'Shared bikes at terminal stops',color:'yellow',votes:1,by:'Ruben Koster'},
  n3:{x:40,y:215,text:'On-demand transport in the evening',color:'yellow',votes:2,by:'Sanne de Vries'},
  n4:{x:440,y:70,text:'Join forces with neighbouring municipalities towards the province',color:'green',votes:4,by:'Noor Bakker'},
  n5:{x:440,y:215,text:'Link the Station Noord hub to housing development',color:'green',votes:2,by:'Sanne de Vries'},

  n8:{x:1240,y:70,text:'Request passenger data for small villages from the province',color:'blue',votes:0,by:'Noor Bakker'}}}
};
const ZONES=[['Ideas',20],['Opportunities',420],['Concerns',820],['Actions',1220]];
const KINDS={doc:{n:'Document',k:'W',cls:'k-doc',col:'wsdoc'},slides:{n:'Presentation',k:'P',cls:'k-ppt',col:'wsslides'},board:{n:'Whiteboard',k:'B',cls:'k-board',col:'wsboard'}};
const WS={db:undefined,room:null,peers:[],list:{},cache:{},subs:[],mountedKey:null,q:{},local:{},timers:{},slideIdx:0,color:'yellow',presenting:false,simDone:false,undoSlides:null,editing:null};

/* ---- storage: db if available, otherwise local ---- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(a,b){ const out=Array.isArray(a)||typeof a!=='object'||a===null?{}:{...a}; for(const k in b){ const v=b[k]; out[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&out[k]&&typeof out[k]==='object'&&!Array.isArray(out[k]))?deepMerge(out[k],v):v; } return out; }
function localData(){ if(!S.wsLocal) S.wsLocal=clone(WS_DEFAULTS); return S.wsLocal; }
const store={
 sub(path,cb){ if(WS.db){ return WS.db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null),e=>{ console.warn('db',e); }); }
  (WS.local[path]=WS.local[path]||[]).push(cb); setTimeout(()=>cb(localData()[path]||null),0); return ()=>{ WS.local[path]=(WS.local[path]||[]).filter(f=>f!==cb); }; },
 write(path,data,merge){ if(WS.db){ const ref=WS.db.doc(path); WS.q[path]=(WS.q[path]||Promise.resolve()).then(()=>merge?ref.update(data).catch(e=>{ if(e&&e.code==='invalid_argument') return ref.set(data); throw e; }):ref.set(data)).catch(e=>{ console.warn(e); note('Saving failed','Your change was not shared. Please try again.'); }); return WS.q[path]; }
  const L=localData(); L[path]=merge&&L[path]?deepMerge(L[path],data):clone(data); save(); (WS.local[path]||[]).forEach(f=>f(L[path])); if(path.startsWith('ws/')) refreshLocalList(); return Promise.resolve(); }
};
function refreshLocalList(){ const L=localData(); WS.list={}; Object.keys(L).filter(k=>k.startsWith('ws/')).forEach(k=>WS.list[k.slice(3)]=L[k]); if((S.view==='community'&&S.params.p==='werkruimtes')||S.view==='werkruimtes') render(); }
function listSubscribe(){ if(WS.db){ WS.db.collection('ws').onSnapshot(snap=>{ WS.list={}; snap.docs.forEach(d=>{ WS.list[d.id]=d.data(); }); if((S.view==='community'&&S.params.p==='werkruimtes')||S.view==='werkruimtes') render(); },e=>console.warn(e)); } else refreshLocalList(); }
(async()=>{
 let db=null, room=null;
 try{ if(window.claude&&typeof window.claude.use==='function') db=await window.claude.use('db'); }catch(e){ db=null; }
 WS.db=db||null; listSubscribe();
 if(S.view==='wsitem'||S.view==='werkruimtes'||(S.view==='community'&&S.params.p==='werkruimtes')){ WS.mountedKey=null; render(); }
 try{ if(window.claude&&typeof window.claude.use==='function') room=await window.claude.use('room'); }catch(e){ room=null; }
 WS.room=room; if(room){ room.onPeers(ch=>{ WS.peers=ch.peers; paintPresence(); if(S.view==='werkruimtes'||(S.view==='community'&&S.params.p==='werkruimtes')) paintListLive(); },()=>{}); setPresence(); }
})();

function livePeers(ws,kind){ return (WS.peers||[]).filter(p=>p.presence&&p.presence.ws===ws&&(!kind||p.presence.item===kind)); }

/* ---- list in community ---- */
function viewWSList(cid){ const u=U();
 if(WS.db===undefined) return `<div class="tile"><div class="empty">Loading workspaces…</div></div>`;
 const items=Object.entries(WS.list).filter(([id,w])=>w&&(!cid||w.community===cid));
 return `<div class="row between" style="margin-bottom:12px"><p class="muted">Collaborate on documents, presentations and brainstorms. Everyone in the community can view; members can contribute.</p><button class="btn primary" data-a="ws-new" data-v="${cid||'ov'}">${icon('plus',16)} New workspace</button></div>
 ${WS.db?'':'<div class="notice warn small" style="margin-bottom:12px">In this online demo, changes are only saved in your own browser.</div>'}
 <div class="grid g2">${items.map(([id,w])=>{ const member=(w.members||[]).includes(u.n); return `<div class="tile ws-card"><div class="tile-h"><h2>${esc(w.title)}</h2><span class="small" id="live-${esc(id)}">${liveLabel(id)}</span></div><div class="tile-b"><p>${esc(w.desc||'')}</p>
  <div class="row between"><div class="row"><div class="facepile">${(w.members||[]).slice(0,5).map(n=>av(n==='Sanne de Vries'?'sanne':n==='Mark Janssen'?'mark':n==='Fatima El Amrani'?'fatima':'x',n,28)).join('')}</div><span class="small muted">${(w.members||[]).length} members</span></div>${member?'<span class="chip ok">You\'re in</span>':`<button class="btn sm primary" data-a="ws-join" data-v="${esc(id)}">Join</button>`}</div>
  <div class="kinds">${Object.entries(KINDS).map(([k,K])=>`<button class="kind" data-a="ws-open" data-v="${esc(id)}" data-k="${k}"><span class="k ${K.cls}">${K.k}</span>${K.n}</button>`).join('')}</div></div></div>`; }).join('')||'<div class="tile"><div class="empty">No workspaces yet. Start one.</div></div>'}</div>`; }
function liveLabel(id){ const n=livePeers(id).length; return n?`<span class="live-dot"></span> ${n} active now`:'<span class="muted">Nobody active</span>'; }
function paintListLive(){ Object.keys(WS.list).forEach(id=>{ const el=document.getElementById('live-'+id); if(el) el.innerHTML=liveLabel(id); }); }

function viewWSAll(){ return `<div class="crumbs">Home › Workspaces</div><div class="pagehead"><div><h1>Workspaces</h1><p>Write, present and brainstorm together with colleagues from your communities.</p></div></div>${viewWSList(null)}`; }
/* ---- item view ---- */
function viewWSItem(){ const {ws,kind}=S.params; const w=WS.list[ws]||WS.cache['ws/'+ws]||{}; const u=U(); const member=(w.members||[]).includes(u.n); const K=KINDS[kind];
 return `<div class="crumbs"><button data-a="go" data-v="werkruimtes">Workspaces</button> › ${esc(w.title||'')}</div>
 <div class="ws-head"><span class="k ${K.cls}" style="width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#fff;font-weight:700">${K.k}</span>
  <div class="grow" style="min-width:200px"><input id="ws-title" aria-label="Title" style="font-size:18px;font-weight:600;border:1px solid transparent;background:none;width:100%;padding:2px 4px;border-radius:4px" value="${esc((WS.cache[K.col+'/'+ws]||{}).title||'')}"><div class="small muted">${esc(w.title||'')} · <span id="ws-status" class="ws-status">${WS.db?'Shared with the workspace':'Local only (open in Claude to collaborate)'}</span></div></div>
  <div class="row"><div class="facepile" id="ws-faces"></div>${member?'':`<button class="btn sm primary" data-a="ws-join" data-v="${esc(ws)}">Join</button>`}</div>
  <div class="row">${Object.entries(KINDS).map(([k,X])=>`<button class="btn sm ${k===kind?'primary':''}" data-a="ws-open" data-v="${esc(ws)}" data-k="${k}">${X.n}</button>`).join('')}</div></div>
 ${kind==='doc'?docShell():kind==='slides'?slidesShell():boardShell()}`; }
function wsAfterRender(){ if(S.view!=='wsitem') return; const key=S.params.ws+'|'+S.params.kind; if(WS.mountedKey!==key&&WS.db!==undefined) wsMount(); paintAll(); }

 WS.subs.push(store.sub('ws/'+ws,d=>{ WS.cache['ws/'+ws]=d; if(d) WS.list[ws]=d; }));

 if(kind==='board') setTimeout(()=>simulateIris(ws),6000);
}

function paintItem(remote){ const k=S.params.kind; const t=document.getElementById('ws-title'); const d=WS.cache[KINDS[k].col+'/'+S.params.ws]; if(t&&d&&document.activeElement!==t) t.value=d.title||'';
 if(k==='doc') paintDoc(remote); else if(k==='slides') paintSlides(remote); else paintBoard(); }
function paintPresence(){ const box=document.getElementById('ws-faces'); if(!box) return; const {ws,kind}=S.params; const u=U();
 const peers=livePeers(ws,kind).filter(p=>!p.sameTab); const me=`<span title="${esc(u.n)} (you)">${av(u.id,u.n,30)}</span>`;
 const demo=kind==='board'||kind==='doc'?`<span title="Iris van Dijk (demo)">${av('x','Iris van Dijk',30)}</span>`:'';
 box.innerHTML=me+peers.map(p=>`<span title="${esc(p.presence.who||'Colleague')}${p.guest?' (guest)':''}"><span class="avatar" style="background:${esc(p.presence.color||'#6E7B88')};width:30px;height:30px;font-size:12px">${esc(String(p.presence.ini||'?').slice(0,2))}</span></span>`).join('')+demo+`<span class="small muted" style="margin-left:8px">${peers.length+1+(demo?1:0)} present${demo?' · Iris is demo':''}</span>`;
 if(kind==='board') paintCursors(); }

/* ---- Document ---- */
function docShell(){ return `<div class="ws-tools" id="doc-tools">
  <button class="tbtn" data-a="ws-fmt" data-v="undo" title="Undo">↶</button><button class="tbtn" data-a="ws-fmt" data-v="redo" title="Redo">↷</button><span class="sep"></span>
  <button class="tbtn" data-a="ws-fmt" data-v="h1">Heading 1</button><button class="tbtn" data-a="ws-fmt" data-v="h2">Heading 2</button><button class="tbtn" data-a="ws-fmt" data-v="p">Text</button><span class="sep"></span>
  <button class="tbtn" data-a="ws-fmt" data-v="bold" title="Bold"><b>B</b></button><button class="tbtn" data-a="ws-fmt" data-v="italic" title="Italic"><i>I</i></button><button class="tbtn" data-a="ws-fmt" data-v="underline" title="Underline"><u>U</u></button><span class="sep"></span>
  <button class="tbtn" data-a="ws-fmt" data-v="ul" title="Bulleted list">• List</button><button class="tbtn" data-a="ws-fmt" data-v="ol" title="Numbered list">1. List</button><span class="sep"></span>
  <button class="tbtn" data-a="ws-fmt" data-v="hilite" title="Highlight" style="background:#FFF3A0;color:#1B2733">Highlight</button>
  <span class="tb-spacer" style="flex:1"></span><span class="small muted" id="doc-count"></span></div>
 <div class="ws-stage ws-split"><div style="overflow:auto;max-height:720px"><div class="paper" id="paper" contenteditable="true" spellcheck="true" aria-label="Document content"></div></div>
 <aside class="ws-side"><h3>${icon('spark',16)} Copilot in this document</h3><div class="row">${['Summarise','Simplify','Find counterarguments','What is still missing?'].map(p=>`<button class="btn sm" data-a="ws-cop" data-v="${p}">${p}</button>`).join('')}</div><div class="cop-out" id="ws-cop-out"><p class="muted">Choose an action. Copilot reads the whole document.</p></div><p class="cop-disc">AI can make mistakes. Check the result.</p>
 <h3>Last edited</h3><p class="small" id="doc-last"></p></aside></div>`; }
function paintDoc(remote){ const p=document.getElementById('paper'); if(!p) return; const d=WS.cache['wsdoc/'+S.params.ws]; if(!d) return;
 if(document.activeElement!==p&&p.innerHTML!==d.html){ p.innerHTML=d.html||'<p></p>'; if(remote&&d.updatedBy&&d.updatedBy!==U().n) setStatus(`Updated by ${d.updatedBy}`); }
 else if(document.activeElement===p&&remote&&d.html!==p.innerHTML&&d.updatedBy!==U().n) setStatus(`${d.updatedBy} has also edited. Click outside the text to refresh.`);
 const last=document.getElementById('doc-last'); if(last) last.textContent=d.updatedBy?`${d.updatedBy}${d.updatedAt?' · '+new Date(d.updatedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}`:'–';
 const c=document.getElementById('doc-count'); if(c) c.textContent=(p.innerText.trim().split(/\s+/).filter(Boolean).length)+' words'; }
function flushDoc(){ if(WS.timers.doc){ clearTimeout(WS.timers.doc); WS.timers.doc=null; saveDoc(); } }
function saveDoc(){ const p=document.getElementById('paper'); const path='wsdoc/'+S.params.ws; if(!p||!WS.cache[path]) return; const html=p.innerHTML; WS.cache[path]={...WS.cache[path],html,updatedBy:U().n,updatedAt:Date.now()}; store.write(path,{html,updatedBy:U().n,updatedAt:Date.now()},true).then(()=>setStatus('Saved · shared with the workspace')); }
document.addEventListener('input',e=>{
 if(e.target.id==='paper'){ setStatus('Saving changes…'); clearTimeout(WS.timers.doc); WS.timers.doc=setTimeout(()=>{WS.timers.doc=null; saveDoc();},900); const c=document.getElementById('doc-count'); if(c) c.textContent=(e.target.innerText.trim().split(/\s+/).filter(Boolean).length)+' words'; }
 if(e.target.classList&&(e.target.classList.contains('s-title')||e.target.classList.contains('s-body'))){ const d=WS.cache['wsslides/'+S.params.ws]; const s=d.slides[WS.slideIdx]; if(e.target.classList.contains('s-title')) s.title=e.target.innerText; else s.body=e.target.innerHTML; paintThumbs(); setStatus('Saving changes…'); clearTimeout(WS.timers.sl); WS.timers.sl=setTimeout(saveSlides,900); }
});
document.addEventListener('focusout',e=>{ if(e.target.id==='paper'){ flushDoc(); setTimeout(()=>paintDoc(false),50); }
 if(e.target.classList&&e.target.classList.contains('ntxt')){ const st=e.target.closest('.sticky'); const id=st.dataset.id; const text=e.target.value.trim()||'…'; WS.editing=null; st.querySelector('.txt').textContent=text; const path='wsboard/'+S.params.ws; if(WS.cache[path]?.notes?.[id]) WS.cache[path].notes[id].text=text; store.write(path,{notes:{[id]:{text}}},true); } });
document.addEventListener('change',e=>{ if(e.target.id==='ws-title'){ const K=KINDS[S.params.kind]; const path=K.col+'/'+S.params.ws; const title=e.target.value.trim(); if(!title) return; WS.cache[path]={...(WS.cache[path]||{}),title}; store.write(path,{title},true); setStatus('Title saved'); } });
document.addEventListener('mousedown',e=>{ if(e.target.closest('#doc-tools')) e.preventDefault(); });

/* ---- Presentation ---- */
function slidesShell(){ return `<div class="ws-tools"><button class="tbtn" data-a="ws-sl" data-v="add">${icon('plus',14)} New slide</button><button class="tbtn" data-a="ws-sl" data-v="dup">Duplicate</button><button class="tbtn" data-a="ws-sl" data-v="up">↑</button><button class="tbtn" data-a="ws-sl" data-v="down">↓</button><button class="tbtn" data-a="ws-sl" data-v="del">Delete</button><span class="sep"></span><button class="tbtn" data-a="ws-sl" data-v="bul">• List</button><span style="flex:1"></span><button class="btn sm brand" data-a="ws-sl" data-v="present">▶ Present</button></div>
 <div class="ws-stage ws-split"><div class="slides-wrap"><div class="thumbs" id="thumbs"></div><div class="slide-area"><div class="slide" id="slide"><div class="s-title" contenteditable="true" aria-label="Slide title"></div><div class="s-body" contenteditable="true" aria-label="Slide content"></div><div class="s-foot">Leer Academie Breda · workspace</div></div></div></div>
 <aside class="ws-side"><h3>${icon('spark',16)} Copilot</h3><button class="btn sm" data-a="ws-cop" data-v="Create slides from the document">Create slides from the document</button><button class="btn sm" data-a="ws-cop" data-v="Speaker notes">Speaker notes for this slide</button><div id="ws-undo"></div><div class="cop-out" id="ws-cop-out"><p class="muted">Copilot can create slides based on the shared document in this workspace.</p></div><p class="cop-disc">AI can make mistakes. Check the result.</p></aside></div>`; }
function paintThumbs(){ const box=document.getElementById('thumbs'); const d=WS.cache['wsslides/'+S.params.ws]; if(!box||!d||!d.slides) return; box.innerHTML=d.slides.map((s,i)=>`<div><div class="thumb-n num">${i+1}</div><button class="thumb ${i===WS.slideIdx?'on':''}" data-a="ws-slide" data-v="${i}"><b>${esc(s.title||'Title')}</b>${esc(strip(s.body||'')).slice(0,120)}</button></div>`).join(''); }
function paintSlides(remote){ const d=WS.cache['wsslides/'+S.params.ws]; if(!d) return; if(!d.slides||!d.slides.length) d.slides=[{title:'New slide',body:'<ul><li></li></ul>'}]; WS.slideIdx=Math.min(WS.slideIdx,d.slides.length-1);
 paintThumbs(); const sl=document.getElementById('slide'); if(!sl) return; const s=d.slides[WS.slideIdx]; const t=sl.querySelector('.s-title'), b=sl.querySelector('.s-body');
 if(document.activeElement!==t) t.innerText=s.title||''; if(document.activeElement!==b) b.innerHTML=s.body||'';
 if(remote) setStatus('Updated'); if(WS.presenting) paintPresent(); }
function saveSlides(){ const d=WS.cache['wsslides/'+S.params.ws]; if(!d) return; store.write('wsslides/'+S.params.ws,{title:d.title||'Presentation',slides:d.slides},false).then(()=>setStatus('Saved · shared with the workspace')); }
function paintPresent(){ let o=document.getElementById('present'); const d=WS.cache['wsslides/'+S.params.ws]; if(!WS.presenting){ if(o) o.remove(); return; } if(!o){ o=document.createElement('div'); o.id='present'; o.className='present'; document.body.appendChild(o); }
 const s=d.slides[WS.slideIdx]; o.innerHTML=`<div class="slide"><div class="s-title">${esc(s.title)}</div><div class="s-body">${s.body}</div><div class="s-foot num">${WS.slideIdx+1} / ${d.slides.length}</div></div><div class="pctl"><button class="btn sm" data-a="ws-pv" data-v="-1">← Previous</button><button class="btn sm" data-a="ws-pv" data-v="1">Next →</button><button class="btn sm" data-a="ws-pv" data-v="x">Stop (Esc)</button></div>`; }

/* ---- Whiteboard ---- */
function boardShell(){ return `<div class="ws-tools"><button class="tbtn" data-a="ws-note">${icon('plus',14)} Sticky</button><span class="sep"></span>${['yellow','pink','blue','green','orange'].map(c=>`<button class="swatch c-${c} ${WS.color===c?'on':''}" data-a="ws-color" data-v="${c}" aria-label="Colour ${c}"></button>`).join('')}<span class="sep"></span><span class="small muted">Double-click to edit · drag to move · +1 to vote</span></div>
 <div class="ws-stage ws-split"><div class="board-scroll" id="board-scroll"><div class="board" id="board">${ZONES.map(([n,x])=>`<div class="zone" style="left:${x}px;width:370px"><b>${n}</b></div>`).join('')}<div id="notes"></div><div id="cursors"></div></div></div>
 <aside class="ws-side"><h3>${icon('spark',16)} Copilot</h3>${['Summarise the brainstorm','Create action points','Which ideas are missing?'].map(p=>`<button class="btn sm" data-a="ws-cop" data-v="${p}">${p}</button>`).join('')}<div class="cop-out" id="ws-cop-out"><p class="muted">Copilot reads all sticky notes and votes on the board.</p></div><p class="cop-disc">AI can make mistakes.</p><h3>Top 3 by votes</h3><ol class="small" id="board-top" style="margin:0;padding-left:18px"></ol></aside></div>`; }
function notesOf(){ const d=WS.cache['wsboard/'+S.params.ws]||{}; return Object.entries(d.notes||{}).filter(([,n])=>n&&typeof n==='object'); }
function paintBoard(){ const box=document.getElementById('notes'); if(!box) return; const notes=notesOf(); const seen=new Set();
 notes.forEach(([id,n])=>{ seen.add(id); let el=box.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if(!el){ el=document.createElement('div'); el.className='sticky'; el.dataset.id=id; el.innerHTML=`<button class="del" data-a="ws-ndel" data-v="${esc(id)}" aria-label="Delete">✕</button><div class="txt"></div><span class="by"></span><button class="vote" data-a="ws-vote" data-v="${esc(id)}"></button>`; box.appendChild(el); }
  if(WS.drag&&WS.drag.id===id) return; el.className=`sticky c-${n.color||'yellow'}`; el.style.left=(n.x||0)+'px'; el.style.top=(n.y||0)+'px';
  const t=el.querySelector('.txt'); if(WS.editing!==id) t.textContent=n.text||''; el.querySelector('.by').textContent=(n.by||'').split(' ')[0]; el.querySelector('.vote').textContent='+'+(n.votes||0); });
 [...box.children].forEach(el=>{ if(!seen.has(el.dataset.id)) el.remove(); });
 const top=document.getElementById('board-top'); if(top) top.innerHTML=notes.slice().sort((a,b)=>(b[1].votes||0)-(a[1].votes||0)).slice(0,3).map(([,n])=>`<li>${esc(n.text)} <span class="muted num">(${n.votes||0})</span></li>`).join(''); }
function paintCursors(){ const box=document.getElementById('cursors'); if(!box) return; const peers=livePeers(S.params.ws,'board').filter(p=>!p.sameTab&&p.presence.cursor);
 box.innerHTML=peers.map(p=>{ const c=p.presence.cursor; const col=esc(p.presence.color||'#6E7B88'); return `<div class="cursor" style="left:${Number(c.x)||0}px;top:${Number(c.y)||0}px"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 1l5 14 2-6 6-2z" fill="${col}" stroke="#fff"/></svg><span style="background:${col}">${esc(p.presence.who||'Colleague')}</span></div>`; }).join('')+(WS.fake?`<div class="cursor" id="fakecur" style="left:${WS.fake.x}px;top:${WS.fake.y}px"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 1l5 14 2-6 6-2z" fill="#6B4FA0" stroke="#fff"/></svg><span style="background:#6B4FA0">Iris van Dijk (demo)</span></div>`:''); }
function boardPoint(e){ const b=document.getElementById('board').getBoundingClientRect(); return {x:Math.round(e.clientX-b.left),y:Math.round(e.clientY-b.top)}; }
document.addEventListener('pointerdown',e=>{ const st=e.target.closest('.sticky'); if(!st||e.target.closest('button,textarea')||WS.editing===st.dataset.id) return; const p=boardPoint(e); WS.drag={id:st.dataset.id,el:st,dx:p.x-parseInt(st.style.left),dy:p.y-parseInt(st.style.top),moved:false}; st.classList.add('dragging'); st.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove',e=>{ if(S.view!=='wsitem'||S.params.kind!=='board') return; const board=document.getElementById('board'); if(!board) return; const p=boardPoint(e);
 if(WS.drag){ const x=Math.max(0,Math.min(1430,p.x-WS.drag.dx)), y=Math.max(0,Math.min(880,p.y-WS.drag.dy)); WS.drag.el.style.left=x+'px'; WS.drag.el.style.top=y+'px'; WS.drag.moved=true; WS.drag.x=x; WS.drag.y=y; }
 if(WS.room&&e.target.closest&&e.target.closest('#board')) WS.room.presence({cursor:{x:p.x,y:p.y}}).catch(()=>{}); });
document.addEventListener('pointerup',()=>{ if(!WS.drag) return; const d=WS.drag; WS.drag=null; d.el.classList.remove('dragging'); if(d.moved){ const path='wsboard/'+S.params.ws; const c=WS.cache[path]; if(c&&c.notes&&c.notes[d.id]){ c.notes[d.id].x=d.x; c.notes[d.id].y=d.y; } store.write(path,{notes:{[d.id]:{x:d.x,y:d.y}}},true); } });
document.addEventListener('dblclick',e=>{ const st=e.target.closest('.sticky'); if(!st||WS.editing===st.dataset.id) return; const id=st.dataset.id; const n=(WS.cache['wsboard/'+S.params.ws]?.notes||{})[id]; const t=st.querySelector('.txt'); WS.editing=id; t.innerHTML=`<textarea class="ntxt" aria-label="Sticky note text">${esc(n?n.text:t.textContent)}</textarea>`; const ta=t.querySelector('textarea'); ta.focus(); ta.select(); });
function simulateIris(ws){ if(WS.simDone||S.view!=='wsitem'||S.params.kind!=='board'||S.params.ws!==ws) return; const notes=Object.fromEntries(notesOf()); if(notes['demo-iris']){ WS.simDone=true; return; } WS.simDone=true;
 WS.fake={x:700,y:520}; paintCursors(); setTimeout(()=>{ WS.fake={x:1250,y:220}; paintCursors(); },400);
 setTimeout(()=>{ store.write('wsboard/'+ws,{notes:{'demo-iris':{x:1240,y:215,text:'Discuss the neighbourhood bus proposal with the Ulvenhout village council',color:'blue',votes:0,by:'Iris van Dijk'}}},true); note('Iris van Dijk added a sticky note','Demo: this is how colleagues’ contributions appear live.'); },1300);
 setTimeout(()=>{ WS.fake=null; paintCursors(); },3200); }

/* ---- Copilot in workspace ---- */
async function wsCopilot(action){ const out=document.getElementById('ws-cop-out'); if(!out) return; if(!SAMPLE){ out.innerHTML='<p>The AI Copilot is switched off in this online demo.</p>'; return; }
 const {ws,kind}=S.params; out.innerHTML='<span class="thinking"><i></i><i></i><i></i></span> <span class="small muted">Copilot is thinking…</span>';
 const base='You are the Learning Copilot of Leer Academie Breda (municipality of Breda) and you help a team in a shared workspace. Answer in clear English at B1 level, short and concrete (max. 180 words), with short bullet lists. Do not invent figures; the content is fictional demo content.\n\n';
 try{
  if(kind==='slides'&&action==="Create slides from the document"){
   const docPath='wsdoc/'+ws; let doc=WS.cache[docPath]; if(!doc){ doc=await new Promise(res=>{ let u=null; u=store.sub(docPath,d=>{ res(d||{}); setTimeout(()=>u&&u(),0); }); }); }
   const txt=strip(doc.html||'').slice(0,8000); if(!txt){ out.innerHTML='<p>There is no document in this workspace yet.</p>'; return; }
   const arr=await SAMPLE.json(base+'Turn the document below into 4 to 6 presentation slides for a steering group. Answer with only a JSON array of objects {"title": string, "bullets": [string]} with at most 4 short bullets per slide. Example: [{"title":"What are we asking for?","bullets":["Quarter-hour service on the North corridor"]}]\n\nDocument:\n'+txt);
   if(!Array.isArray(arr)||!arr.length) throw {code:'invalid_json'};
   const d=WS.cache['wsslides/'+ws]; WS.undoSlides=clone(d.slides); d.slides=arr.slice(0,8).map(s=>({title:String(s.title||''),body:'<ul>'+(Array.isArray(s.bullets)?s.bullets:[]).slice(0,6).map(b=>`<li>${esc(String(b))}</li>`).join('')+'</ul>'}));
   WS.slideIdx=0; saveSlides(); paintSlides(false); out.innerHTML=`<p>${arr.length} slides created from the document. Feel free to adjust them.</p>`; document.getElementById('ws-undo').innerHTML='<button class="btn sm" data-a="ws-sl" data-v="undo">Undo</button>'; return; }
  let ctx='';
  if(kind==='doc'){ const p=document.getElementById('paper'); ctx='Document:\n'+(p?p.innerText:'').slice(0,12000); }
  if(kind==='slides'){ const d=WS.cache['wsslides/'+ws]; const s=d.slides[WS.slideIdx]; ctx=`Current slide (${WS.slideIdx+1}): ${s.title}\n${strip(s.body)}\n\nAll slides:\n`+d.slides.map((x,i)=>`${i+1}. ${x.title}: ${strip(x.body)}`).join('\n'); }
  if(kind==='board') ctx='Sticky notes on the whiteboard (zone determined by x position: Ideas <400, Opportunities <800, Concerns <1200, Actions beyond that):\n'+notesOf().map(([,n])=>`- [${ZONES.slice().reverse().find(z=>n.x>=z[1]-20)?.[0]||'Ideas'}] ${n.text} (${n.votes||0} votes, ${n.by})`).join('\n');
  const task={ 'Summarise':'Summarise the document in 5 bullets for an alderman.','Simplify':'Give the 5 sentences in the document that are least clear, each with a B1 version next to it.','Find counterarguments':'Give 3 strong counterarguments that a council member or the province could raise against this input, each with a short reply.','What is still missing?':'Which sections or supporting evidence are still missing from this document? Maximum 5 points.','Speaker notes':'Write short speaker notes (max. 80 words) for the current slide.','Summarise the brainstorm':'Summarise the brainstorm per zone and name the ideas with the most votes.','Create action points':'Create 3 to 5 concrete action points from this brainstorm, with a suggestion for who (role) should pick them up.','Which ideas are missing?':'Which 3 ideas or concerns are still missing from the board? Explain briefly.'}[action]||action;
  const {text}=await SAMPLE(base+task+'\n\n'+ctx,{cache:false,onText:({text})=>{ const o=document.getElementById('ws-cop-out'); if(o) o.innerHTML=md(text); }});
  const o=document.getElementById('ws-cop-out'); if(o) o.innerHTML=md(text)+(kind==='board'&&action==='Create action points'?'<button class="btn sm" data-a="ws-toacts">Add as sticky notes in Actions</button>':'');
  WS.lastCop=text;
 }catch(e){ const o=document.getElementById('ws-cop-out'); if(o) o.innerHTML=`<p style="color:var(--bad)">${e&&e.code==='not_granted'?'You have not given Copilot permission.':e&&e.code==='rate_limited'?'It is a bit busy right now. Please try again shortly.':'That did not work. Please try again.'}</p>`; if(e&&['not_granted','sampling_disabled'].includes(e.code)) SAMPLE=null; } }

/* ---- actions ---- */
function wsClick(a,v,t,e){ const ws=S.params.ws;
 switch(a){
  case 'ws-new': S.modal=['newws',v]; render(); break;
  case 'ws-open': go('wsitem',{ws:v,kind:t.dataset.k}); break;
  case 'ws-join': { const w=WS.list[v]||WS.cache['ws/'+v]; if(!w) return; const members=[...new Set([...(w.members||[]),U().n])]; w.members=members; store.write('ws/'+v,{members},true).then(()=>{ note('You\'re in',`You are a member of “${w.title}”.`); render(); }); break; }
  case 'ws-fmt': { const p=document.getElementById('paper'); if(!p) return; p.focus(); const cmd={bold:['bold'],italic:['italic'],underline:['underline'],ul:['insertUnorderedList'],ol:['insertOrderedList'],undo:['undo'],redo:['redo'],h1:['formatBlock','<h1>'],h2:['formatBlock','<h2>'],p:['formatBlock','<p>'],hilite:['hiliteColor','#FFF3A0']}[v]; if(cmd){ document.execCommand(cmd[0],false,cmd[1]); p.dispatchEvent(new Event('input',{bubbles:true})); } break; }
  case 'ws-cop': wsCopilot(v); break;
  case 'ws-slide': WS.slideIdx=+v; paintSlides(false); break;
  case 'ws-sl': { const d=WS.cache['wsslides/'+ws]; if(!d) return; const i=WS.slideIdx;
   if(v==='add'){ d.slides.splice(i+1,0,{title:'New slide',body:'<ul><li>Point</li></ul>'}); WS.slideIdx=i+1; }
   if(v==='dup'){ d.slides.splice(i+1,0,clone(d.slides[i])); WS.slideIdx=i+1; }
   if(v==='del'){ if(d.slides.length<2) return note('A presentation needs at least one slide'); d.slides.splice(i,1); WS.slideIdx=Math.max(0,i-1); }
   if(v==='up'&&i>0){ [d.slides[i-1],d.slides[i]]=[d.slides[i],d.slides[i-1]]; WS.slideIdx=i-1; }
   if(v==='down'&&i<d.slides.length-1){ [d.slides[i+1],d.slides[i]]=[d.slides[i],d.slides[i+1]]; WS.slideIdx=i+1; }
   if(v==='bul'){ const b=document.querySelector('#slide .s-body'); b.focus(); document.execCommand('insertUnorderedList'); b.dispatchEvent(new Event('input',{bubbles:true})); return; }
   if(v==='present'){ WS.presenting=true; paintPresent(); return; }
   if(v==='undo'){ if(WS.undoSlides){ d.slides=WS.undoSlides; WS.undoSlides=null; document.getElementById('ws-undo').innerHTML=''; } }
   saveSlides(); paintSlides(false); break; }
  case 'ws-pv': { const d=WS.cache['wsslides/'+ws]; if(v==='x'){ WS.presenting=false; paintPresent(); paintSlides(false); return; } WS.slideIdx=Math.max(0,Math.min(d.slides.length-1,WS.slideIdx+(+v))); paintPresent(); break; }
  case 'ws-color': WS.color=v; document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.v===v)); break;
  case 'ws-note': { const sc=document.getElementById('board-scroll'); const id='n'+Date.now().toString(36); const x=Math.min(1400,Math.round(sc.scrollLeft+sc.clientWidth/2-85)), y=Math.min(860,Math.round(sc.scrollTop+sc.clientHeight/2-55)); const n={x,y,text:'New idea',color:WS.color,votes:0,by:U().n}; const path='wsboard/'+ws; WS.cache[path]=WS.cache[path]||{notes:{}}; WS.cache[path].notes=WS.cache[path].notes||{}; WS.cache[path].notes[id]=n; paintBoard(); store.write(path,{notes:{[id]:n}},true);
   setTimeout(()=>{ const el=document.querySelector(`.sticky[data-id="${id}"]`); if(el) el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true})); },50); break; }
  case 'ws-vote': { const path='wsboard/'+ws; const n=WS.cache[path]?.notes?.[v]; if(!n) return; n.votes=(n.votes||0)+1; paintBoard(); store.write(path,{notes:{[v]:{votes:n.votes}}},true); break; }
  case 'ws-ndel': { const path='wsboard/'+ws; if(WS.cache[path]?.notes) WS.cache[path].notes[v]=null; paintBoard(); store.write(path,{notes:{[v]:null}},true); break; }
  case 'ws-toacts': { const lines=(WS.lastCop||'').split('\n').map(l=>l.replace(/^\s*(\d+[.)]|[-*•])\s+/,'').replace(/\*\*/g,'').trim()).filter(l=>l.length>8).slice(0,5); const path='wsboard/'+ws; const add={}; lines.forEach((l,i)=>{ add['a'+Date.now().toString(36)+i]={x:1240+(i%2)*185,y:370+Math.floor(i/2)*140,text:l.slice(0,140),color:'blue',votes:0,by:'Copilot'}; }); WS.cache[path].notes={...WS.cache[path].notes,...add}; paintBoard(); store.write(path,{notes:add},true); note('Action points added',`${lines.length} sticky notes in the Actions zone.`); break; }
 }

function wsSubmit(k,f,val){ if(k!=='newws') return false; const cid=f.dataset.v; const title=val('nw-t'); if(!title) return true; const id='w'+Date.now().toString(36); const me=U().n;

  .then(()=>{ go('wsitem',{ws:id,kind:'board'}); note('Workspace created','Invite colleagues by sharing the link; they click Join.'); });
 return true; }
document.addEventListener('change',e=>{ if(e.target.dataset.change==='acct'){ wsUnmount(); setTimeout(()=>setPresence(),0); } });

 let block=document.getElementById('tour-block'), hole=document.getElementById('tour-hole'), tip=document.getElementById('tour-tip');
 if(!block){ block=document.createElement('div'); block.id='tour-block'; block.className='tour-block'; document.body.appendChild(block); }

 const el=s.el?s.el():null; const n=T.steps.length;
 tip.className='tour-tip'+(s.big||!el?' big':'');

  <div class="tour-prog" aria-hidden="true"><i style="width:${Math.round((T.i+1)/n*100)}%"></i></div>

 if(el){ el.scrollIntoView({block:'center',inline:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }

 setTimeout(()=>tip.querySelector('[data-tour-a="next"]')?.focus({preventScroll:true}),300);

function tourPlace(el,s){ const hole=document.getElementById('tour-hole'), tip=document.getElementById('tour-tip'); if(!hole||!tip) return;
 const vw=innerWidth, vh=innerHeight, tw=tip.offsetWidth, th=tip.offsetHeight, pad=8, gap=14;
 if(!el){ hole.classList.add('center'); hole.style.cssText=''; tip.style.left=Math.max(16,(vw-tw)/2)+'px'; tip.style.top=Math.max(16,(vh-th)/2)+'px'; return; }
 hole.classList.remove('center'); const r=el.getBoundingClientRect();
 const x=Math.max(4,r.left-pad), y=Math.max(4,r.top-pad), w=Math.min(vw-8,r.width+pad*2), h=Math.min(vh-8,r.height+pad*2);
 Object.assign(hole.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 const fits={right:x+w+gap+tw<vw-8,left:x-gap-tw>8,bottom:y+h+gap+th<vh-8,top:y-gap-th>8};
 const order=[s.place||'bottom','bottom','right','left','top'].filter((v,i,a)=>a.indexOf(v)===i);
 const p=order.find(o=>fits[o]);
 let L,Tp;
 if(p==='right'){ L=x+w+gap; Tp=y; } else if(p==='left'){ L=x-gap-tw; Tp=y; } else if(p==='top'){ L=x; Tp=y-gap-th; } else if(p==='bottom'){ L=x; Tp=y+h+gap; } else { L=(vw-tw)/2; Tp=vh-th-24; }
 tip.style.left=Math.min(Math.max(16,L),vw-tw-16)+'px'; tip.style.top=Math.min(Math.max(16,Tp),vh-th-16)+'px'; }
