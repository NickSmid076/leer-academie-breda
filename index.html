 ov:{id:'ov',title:'OV-beleid: van visie naar concessie',domain:'ov',cover:'cov-ov',dur:'45 min',required:false,blended:true,
  intro:'Hoe vertaal je een OV-visie naar concrete eisen en een heldere adviesnota? Vijf korte lessen met oefeningen, een rollenspel en twee missies.',
  lessons:[
   {t:'Wie doet wat in het OV?',body:`<p>In het stads- en streekvervoer werken drie partijen samen. De <b>provincie</b> is concessieverlener: zij besteedt het busvervoer aan en stelt het programma van eisen vast. De <b>vervoerder</b> voert de dienstregeling uit binnen de concessie. De <b>gemeente</b> gaat over de openbare ruimte: haltes, doorstroming, fietsenstallingen bij knooppunten en de ruimtelijke ontwikkeling die reizigers oplevert.</p>
<div class="callout">Als gemeente heb je dus geen formele zeggenschap over de dienstregeling, maar wel veel invloed: via je inbreng op het programma van eisen, via infrastructuur, en via bestuurlijk overleg.</div>
<p>Goede OV-beleidsmedewerkers kennen die rolverdeling precies, zodat ze hun advies richten aan de partij die er echt over gaat.</p>`,
    quiz:{q:'Wie stelt het programma van eisen voor een busconcessie vast?',o:['De gemeente','De provincie','De vervoerder'],c:1,e:'De provincie is concessieverlener en stelt het programma van eisen vast. De gemeente levert daarvoor inbreng.'}},
   {t:'Van OV-visie naar programma van eisen',body:`<p>Een OV-visie beschrijft wat je wilt bereiken, bijvoorbeeld: "Elke wijk binnen 10 minuten lopen van een halte met minstens een kwartierdienst." Een programma van eisen maakt dat meetbaar en afrekenbaar.</p>
<ul><li><b>Visie:</b> richting en ambitie, voor het bestuur.</li><li><b>Inbreng gemeente:</b> concrete wensen per corridor of wijk, met onderbouwing.</li><li><b>Programma van eisen:</b> meetbare eisen, zoals frequentie, bedieningstijden, toegankelijkheid en uitstoot.</li></ul>
<p>De kunst is om ambities zo te formuleren dat de provincie ze kan overnemen: specifiek, meetbaar en met een duidelijk belang voor reizigers.</p>`,
    quiz:{q:'Welke formulering is het beste bruikbaar als inbreng voor een programma van eisen?',o:['Het OV in Breda-Noord moet beter.','Lijn Breda-Noord: minimaal elke 15 minuten tussen 7.00 en 19.00 uur op werkdagen.','We willen een aantrekkelijk en duurzaam OV-netwerk.'],c:1,e:'Alleen de tweede is specifiek en meetbaar. De andere twee zijn ambities die thuishoren in een visie.'}},
   {t:'Onderbouwen met reizigersdata',body:`<p>Een wens weegt zwaarder als je hem onderbouwt. Kijk naar in- en uitstappers per halte, reistijden, en waar nieuwe woningen komen. Hieronder een fictief voorbeeld van een corridor.</p>
<table class="datatable num"><tr><th>Halte (fictief)</th><th>Instappers/dag</th><th>Groei '24–'26</th><th>Nieuwe woningen tot 2030</th></tr>
<tr><td>Station Noord</td><td>1.840</td><td>+12%</td><td>650</td></tr>
<tr><td>Wijkcentrum Haagse Beemden</td><td>920</td><td>+4%</td><td>120</td></tr>
<tr><td>Bedrijventerrein Hazeldonk</td><td>410</td><td>+21%</td><td>0</td></tr></table>
<p>Let op: groei in procenten zegt weinig zonder de absolute aantallen. En woningbouwplannen zijn een prognose, geen zekerheid. Benoem dat eerlijk in je nota.</p>`,
    quiz:{q:'Welke conclusie is het best onderbouwd door de tabel?',o:['Hazeldonk heeft de meeste reizigers.','Station Noord heeft veel reizigers én de meeste nieuwe woningen, dus daar is extra capaciteit het best te onderbouwen.','Haagse Beemden kan zonder busverbinding.'],c:1,e:'Station Noord combineert het hoogste aantal instappers met de grootste woningbouwopgave. Hazeldonk groeit hard, maar vanaf een laag niveau.'}},
   {t:'Belangen afwegen',body:`<p>OV-keuzes raken meerdere belangen tegelijk: <b>bereikbaarheid</b> (snelle, frequente lijnen), <b>inclusie</b> (ook ouderen en kleine kernen bereikbaar houden), <b>kosten</b> (exploitatie per reiziger) en <b>duurzaamheid</b>. Die belangen botsen vaak: een snelle, rechte lijn bedient minder straten.</p>
<div class="callout">Raadsleden vragen vaak: "Wie gaat erop achteruit?" Zorg dat je dat antwoord paraat hebt, met aantallen.</div>
<p>Oefen dit met de Copilot: kies <b>Oefen een gesprek</b> en laat je bevragen door een kritisch raadslid.</p>`,
    quiz:{q:'Een raadslid vraagt: "Wie gaat erop achteruit als we de lijn strekken?" Wat is het sterkste antwoord?',o:['Niemand, iedereen gaat erop vooruit.','Ongeveer 300 inwoners in twee straten krijgen een langere loopafstand (van 300 naar 550 meter); daar tegenover staat 6 minuten reistijdwinst voor 2.100 reizigers per dag.','Dat moet u aan de provincie vragen.'],c:1,e:'Een eerlijk antwoord met aantallen en de afweging maakt je advies geloofwaardig.'}},
   {t:'Een heldere adviesnota',body:`<p>Een goede adviesnota voor college en raad begint met de kern: wat wordt er gevraagd, wat is je advies en waarom. Schrijf in B1-taal, gebruik korte zinnen en zet cijfers in een tabel.</p>
<ul><li><b>Beslispunt</b> in één zin.</li><li><b>Aanleiding</b> in maximaal vijf regels.</li><li><b>Afweging</b> met de belangen uit les 4.</li><li><b>Wat betekent dit voor inwoners?</b> Concreet en eerlijk.</li></ul>
<p>Plak een alinea uit je eigen nota in de Copilot en kies <b>Check mijn tekst</b>.</p>`,
    quiz:{q:'Waar begint een goede adviesnota mee?',o:['Een uitgebreide beschrijving van de geschiedenis van het dossier','Het beslispunt en je advies','Een overzicht van alle betrokken partijen'],c:1,e:'Bestuurders lezen eerst de kern. Begin met wat er besloten moet worden en wat je adviseert.'}}
  ],
  prompts:['Leg dit simpel uit','Overhoor mij','Pas toe op mijn werk','Oefen een gesprek','Check mijn tekst','Wat past bij mij?'],
  roleplay:'een kritisch raadslid van een oppositiepartij die zich zorgen maakt over inwoners in kleine kernen'},
 ai:{id:'ai',title:'Werken met Copilot en AI',domain:'ai',cover:'cov-ai',dur:'30 min',required:false,blended:false,
  intro:'Verantwoord en slim AI gebruiken in beleidswerk: wat kan het, wat mag het, en hoe schrijf je goede prompts?',
  lessons:[
   {t:'Wat is generatieve AI, en wat niet?',body:`<p>Generatieve AI, zoals Copilot, voorspelt tekst op basis van patronen. Het is sterk in samenvatten, herschrijven, structureren en meedenken. Het is <b>geen</b> bron van waarheid: het kan feiten verzinnen die overtuigend klinken.</p><div class="callout">Vuistregel: gebruik AI als sparringpartner, niet als bron. Controleer cijfers, wetten en citaten altijd zelf.</div>`,
    quiz:{q:'Copilot noemt een wetsartikel dat je niet kent. Wat doe je?',o:['Overnemen, want AI is meestal correct','Het artikel zelf opzoeken en controleren','Copilot vragen of het zeker is'],c:1,e:'AI kan bronnen verzinnen. Controleer altijd zelf in de officiële bron, bijvoorbeeld wetten.overheid.nl.'}},
   {t:'Goede prompts schrijven',body:`<p>Een goede prompt heeft vier onderdelen: <b>rol</b> (wie moet de AI zijn), <b>taak</b> (wat moet er gebeuren), <b>context</b> (achtergrond, doelgroep) en <b>vorm</b> (lengte, opbouw).</p><p>Voorbeeld: "Je bent een ervaren beleidsadviseur. Vat deze notitie samen voor een wethouder in vijf bullets, in B1-taal."</p>`,
    quiz:{q:'Welk onderdeel ontbreekt in de prompt "Vat deze tekst samen"?',o:['Alleen de rol','Rol, context en vorm','Niets, dit is compleet'],c:1,e:'De taak staat erin, maar rol, context (voor wie?) en vorm (hoe lang, welke opbouw?) ontbreken.'}},
   {t:'Wat mag wel en niet?',body:`<p>Gebruik alleen de AI-tools die de gemeente heeft goedgekeurd. Plak nooit persoonsgegevens (namen, BSN, adressen van inwoners) of vertrouwelijke stukken in een AI-tool die daarvoor niet is ingericht. Vermeld het als AI een wezenlijke bijdrage leverde aan een stuk.</p>`,
    quiz:{q:'Mag je een klachtbrief met naam en adres van een inwoner in een publieke AI-chatbot plakken?',o:['Ja, als je de brief daarna verwijdert','Nee, dat zijn persoonsgegevens','Ja, als het voor je werk is'],c:1,e:'Persoonsgegevens horen niet in AI-tools die daar niet voor zijn goedgekeurd. Anonimiseer eerst of gebruik de goedgekeurde omgeving.'}},
   {t:'AI als sparringpartner',body:`<p>Laat AI tegenargumenten zoeken, je tekst kritisch lezen of een lastige vraag van een raadslid simuleren. Jij blijft verantwoordelijk voor het oordeel.</p><p>Probeer het: vraag de Copilot om drie tegenargumenten op een voorstel waar je nu aan werkt.</p>`,
    quiz:{q:'Wie is verantwoordelijk voor een advies dat met hulp van AI is geschreven?',o:['De AI-leverancier','Jij als opsteller','Niemand'],c:1,e:'De opsteller blijft verantwoordelijk voor inhoud en afweging.'}}
  ],
  prompts:['Leg dit simpel uit','Overhoor mij','Pas toe op mijn werk','Check mijn tekst','Wat past bij mij?'],
  roleplay:'een collega die twijfelt of AI wel mag worden gebruikt'},
 sec:{id:'sec',title:'Veilig werken: phishing herkennen',domain:'sec',cover:'cov-sec',dur:'20 min',required:true,deadline:'15 okt 2026',blended:false,
  intro:'Verplichte module. Leer phishing herkennen, weet wat je doet als je twijfelt, en meld verdachte mails.',
  lessons:[
   {t:'Waarom phishing werkt',body:`<p>Phishing speelt in op haast, nieuwsgierigheid en gezag. Een mail die zegt dat je pakket niet bezorgd kan worden of dat je wachtwoord vandaag verloopt, zet je onder druk. Juist bij hoge werkdruk klikken we sneller.</p>`,
    quiz:{q:'Waarom werkt phishing vaak juist bij drukke medewerkers?',o:['Drukke mensen lezen minder mail','Onder tijdsdruk controleren we minder goed','Phishing wordt alleen op drukke dagen verstuurd'],c:1,e:'Tijdsdruk maakt dat we sneller en minder kritisch handelen.'}},
   {t:'Zes herkenningspunten',body:`<ul><li><b>Afzender:</b> klopt het domein precies? (bijv. breda-servicedesk.net in plaats van breda.nl)</li><li><b>Urgentie:</b> "binnen 24 uur", "laatste waarschuwing".</li><li><b>Link:</b> ga er met je muis over zonder te klikken. Waar leidt hij echt heen?</li><li><b>Aanhef:</b> "Beste gebruiker" in plaats van je naam.</li><li><b>Vraag:</b> om inloggegevens, betaling of een bijlage te openen.</li><li><b>Taal en stijl:</b> net iets anders dan normaal.</li></ul>`,
    quiz:{q:'Welke afzender is het meest verdacht?',o:['servicedesk@breda.nl','servicedesk@breda-servicedesk.net','m.janssen@breda.nl'],c:1,e:'Het domein breda-servicedesk.net lijkt op de gemeente, maar is het niet.'}},
   {t:'Twijfel je, of heb je geklikt?',body:`<p>Twijfel je: klik niet, maar meld de mail met de knop <b>Meld phishing</b>. Heb je al geklikt of iets ingevuld? Meld het direct bij de servicedesk. Dat is geen schande: hoe sneller je meldt, hoe kleiner de schade.</p>`,
    quiz:{q:'Je hebt per ongeluk je wachtwoord ingevuld op een verdachte pagina. Wat doe je eerst?',o:['Niets zeggen en hopen dat het goed gaat','Direct melden bij de servicedesk en je wachtwoord wijzigen','Morgen even navragen'],c:1,e:'Snel melden beperkt de schade. Niemand krijgt hier een verwijt voor.'}},
   {t:'Melden is goed',body:`<p>Elke melding helpt collega's: Informatiebeveiliging kan de mail dan bij iedereen blokkeren. Oefen met de demo-inbox onder <b>Veilig werken</b>. Voor elke terechte melding krijg je XP.</p>`,
    quiz:{q:'Wat gebeurt er met een gemelde phishingmail?',o:['Niets','Informatiebeveiliging kan hem voor iedereen blokkeren','Je krijgt een waarschuwing'],c:1,e:'Eén melding kan honderden collega\'s beschermen.'}}
  ],
  prompts:['Leg dit simpel uit','Overhoor mij','Is dit phishing?','Wat past bij mij?'],
  roleplay:'een oplichter die zich voordoet als de IT-servicedesk; na afloop leg je uit welke signalen de medewerker had kunnen zien'},

function md(t){
 const lines=esc(t).split('\n'); let out='',list=null;
 const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
 const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
 let para=[];
 const flush=()=>{ if(para.length){ out+=`<p>${inl(para.join('<br>'))}</p>`; para=[]; } };
 lines.forEach(l=>{
  const b=l.match(/^\s*[-*•]\s+(.*)/), n=l.match(/^\s*\d+[.)]\s+(.*)/), h=l.match(/^#{1,4}\s+(.*)/);
  if(b||n){ flush(); const k=b?'ul':'ol'; if(list!==k){ close(); out+=`<${k}>`; list=k; } out+=`<li>${inl((b||n)[1])}</li>`; }
  else if(h){ flush(); close(); out+=`<p><b>${inl(h[1])}</b></p>`; }
  else if(!l.trim()){ flush(); close(); }
  else { close(); para.push(l); }
 });
 flush(); close(); return out;
}
function toast(title,sub,kind){ if(S.calm && kind!=='plain') return; const box=document.getElementById('toasts'); const d=document.createElement('div'); d.className='toast'+(kind==='lvl'?' lvlup':''); d.innerHTML=`<b>${esc(title)}</b>${sub?`<span class="small muted">${esc(sub)}</span>`:''}`; box.appendChild(d); setTimeout(()=>d.remove(),4200); }
function note(title,sub){ const box=document.getElementById('toasts'); const d=document.createElement('div'); d.className='toast'; d.style.borderLeftColor='var(--link)'; d.innerHTML=`<b>${esc(title)}</b>${sub?`<span class="small muted">${esc(sub)}</span>`:''}`; box.appendChild(d); setTimeout(()=>d.remove(),4200); }
function addXP(d,x,reason){ const u=U(); const before=lvl(u.xp[d]); u.xp[d]=(u.xp[d]||0)+x; const after=lvl(u.xp[d]); u.xplog.unshift({t:reason,x,d,when:'zojuist'});
 toast(`+${x} XP · ${DOMAINS[d]}`,reason);
 if(after.i>before.i) setTimeout(()=>toast(`Level omhoog: ${after.name}`,`${DOMAINS[d]} – je bent nu ${after.name}.${after.i>=3?' Je kunt je nu aanmelden als expert in de community.':''}`,'lvl'),600);
}

function modDone(u,mid){ const m=MODULES[mid]; const p=u.progress[mid]; return !!(p && m.lessons.length && p.done.length>=m.lessons.length); }
function modPct(u,mid){ const m=MODULES[mid]; const p=u.progress[mid]; if(!p||!m.lessons.length) return 0; return Math.round(p.done.length/m.lessons.length*100); }

function strip(h){ return h.replace(/<tr>/g,'\n').replace(/<\/t[dh]>/g,' | ').replace(/<li>/g,'\n- ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim(); }
function rules(m,li){ const u=U(); const lib=S.promptLib?.[m.id]||m.prompts;
 return `Je bent de Leer-Copilot van Leer Academie Breda, het leerplatform van de gemeente Breda. Je zit naast een e-learningmodule en helpt medewerkers leren en de stof toepassen in hun werk.
Regels:
- Antwoord altijd in helder Nederlands op B1-niveau. Kort: meestal 60-150 woorden, korte alinea's of opsommingen.
- Baseer uitleg op de lesstof hieronder en noem uit welke les iets komt ("Uit les 3: ..."). Staat iets niet in de lesstof, zeg dat en geef algemene uitleg met voorbehoud.
- Verzin geen wetsartikelen, cijfers of bronnen. De cijfers in de lesstof zijn fictieve voorbeelddata.
- Vraag nooit om persoonsgegevens. Plakt de gebruiker namen, adressen of BSN van inwoners, waarschuw dan vriendelijk en ga zonder die gegevens verder.
- Je beoordeelt medewerkers niet voor HR-doeleinden en deelt niets met leidinggevenden. Wees bemoedigend en concreet.
- Het is een demo met fictieve personen; blijf realistisch en professioneel.

Gebruiker: ${u.n}, ${u.f}, team ${u.team}.${u.id==='sanne'?' Werkt aan de OV-visie van Breda en een raadsvoorstel daarover (deadline over zes weken), en aan de inbreng van de gemeente voor de nieuwe busconcessie.':''}
Groeipad: ${Object.entries(u.xp).map(([d,x])=>`${DOMAINS[d]} ${lvl(x).name} (${x} XP)`).join('; ')}.

Module: ${m.title}. De gebruiker zit nu in les ${li+1}: "${m.lessons[li].t}".
Lesstof:
${m.lessons.map((l,i)=>`Les ${i+1}: ${l.t}\n${strip(l.body)}`).join('\n\n')}

Beschikbare modules: ${Object.values(MODULES).map(x=>x.title).join('; ')}.
Missies: ${MISSIONS.map(x=>`${x.t} (${x.task})`).join('; ')}.
Communities: ${COMMUNITIES.map(x=>x.n).join('; ')}.
Knoppen in deze module: ${lib.join(', ')}.`; }
let copCtl=null;
async function askCopilot(text,show){ const m=MODULES[S.params.id]; const u=U(); const li=S.params.l??u.progress[m.id].cur; const c=cop(m.id+'-'+S.user); if(c.busy||!SAMPLE) return;
 c.turns.push({role:'user',content:text,show}); c.busy=true; render();
 const turns=c.turns.slice(-14).map(t=>({role:t.role,content:t.content})); while(turns.length&&turns[0].role!=='user') turns.shift();
 const input=[{role:'user',content:rules(m,li)},...turns];
 copCtl=new AbortController(); const el=()=>document.getElementById('cop-stream');
 try{
  const {text:out,truncated}=await SAMPLE(input,{cache:false,signal:copCtl.signal,onText:({text})=>{const e=el(); if(e){ e.innerHTML=md(text); const b=document.getElementById('cop-body'); if(b) b.scrollTop=b.scrollHeight; }}});
  c.turns.push({role:'assistant',content:out+(truncated?'\n\n*(Antwoord afgekort. Vraag om minder tegelijk.)*':'')});
 }catch(e){
  const map={not_granted:'Je hebt de Copilot geen toestemming gegeven. Herlaad de pagina om het opnieuw te proberen.',rate_limited:'Het is even te druk. Probeer het over een minuut opnieuw.',refused:'Daar kan ik niet mee helpen. Probeer je vraag anders te stellen.',session_expired:'Je sessie is verlopen. Log opnieuw in bij Claude.',prompt_too_large:'Het gesprek is te lang geworden. Start een nieuw gesprek.',sampling_disabled:'De Copilot is niet beschikbaar voor dit account.'};
  if(e&&e.code==='cancelled'){ c.turns.push({role:'assistant',content:(e.text||'')+(e.text?'\n\n':'')+'*(Gestopt)*'}); }
  else c.turns.push({role:'assistant',content:e?.text||'',err:map[e?.code]||'Er ging iets mis bij de Copilot. Probeer het opnieuw.'});
  if(e&&['not_granted','sampling_disabled','capability_disabled','not_declared'].includes(e.code)) SAMPLE=null;
 }
 c.busy=false; copCtl=null; save(); if(S.view==='module') render();
}

function viewBeheer(){ const tab=S.params.p||'dashboard'; return `<div class="crumbs">Home › Beheer</div><div class="pagehead"><div><h1>Beheer Leer Academie</h1><p>Content, Copilot-prompts, campagnes, communities en effect.</p></div></div>
 <div class="tabs">${[['dashboard','Dashboard'],['content','Content & Copilot'],['campagnes','Campagnes'],['communities','Communities']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="btab" data-v="${k}">${l}</button>`).join('')}</div>${beheerTab(tab)}`; }
function beheerTab(tab){
 if(tab==='dashboard'){ const rows=[['Mobiliteit & Bereikbaarheid',78,2.1],['Burgerzaken',66,1.4],['Ruimtelijke Ontwikkeling',59,1.2],['Sociaal Domein',54,0.9],['Financiën',48,0.7],['HR',72,1.8]];
  return `<div class="notice small" style="margin-bottom:12px">Alle cijfers zijn fictieve demo-data en worden alleen geaggregeerd getoond (minimaal 5 personen per groep).</div>
  <div class="grid g2"><div class="tile"><div class="tile-h"><h2>Wekelijks actief per afdeling</h2></div><div class="tile-b">${rows.map(r=>`<div class="hbar"><span>${r[0]}</span><div class="bar"><i style="width:${r[1]}%"></i></div><b class="num">${r[1]}%</b></div>`).join('')}</div></div>
  <div class="tile"><div class="tile-h"><h2>Missies toegepast per medewerker (per maand)</h2></div><div class="tile-b">${rows.map(r=>`<div class="hbar"><span>${r[0]}</span><div class="bar xpbar"><i style="width:${r[2]/2.5*100}%"></i></div><b class="num">${r[2].toString().replace('.',',')}</b></div>`).join('')}<p class="small muted">Doel uit het PRD: ≥ 2 per persoon per maand.</p></div></div>
  <div class="tile"><div class="tile-h"><h2>Copilot per module</h2></div><div class="tile-b scroll-x"><table class="tbl num"><tr><th>Module</th><th>Gesprekken</th><th>Nuttig</th><th>Meest gebruikte knop</th></tr><tr><td>OV-beleid</td><td>182</td><td>84%</td><td>Pas toe op mijn werk</td></tr><tr><td>Werken met Copilot en AI</td><td>344</td><td>88%</td><td>Overhoor mij</td></tr><tr><td>Veilig werken</td><td>97</td><td>91%</td><td>Is dit phishing?</td></tr></table></div></div>
  <div class="tile"><div class="tile-h"><h2>Phishing-oefencampagnes</h2></div><div class="tile-b scroll-x">${campaignTable()}</div></div></div>`; }
 if(tab==='content'){ const mid=S.params.m||'ov'; const m=MODULES[mid]; const lib=S.promptLib?.[mid]||m.prompts;
  return `<div class="grid g2"><div class="tile"><div class="tile-h"><h2>Modules</h2><button class="btn sm">${icon('plus',14)} Nieuwe module</button></div><div class="tile-b scroll-x"><table class="tbl"><tr><th>Titel</th><th>Status</th><th>Lessen</th><th></th></tr>${Object.values(MODULES).map(x=>`<tr><td>${esc(x.title)}${x.required?' <span class="chip req">Verplicht</span>':''}</td><td>${x.stub?'<span class="chip">Concept</span>':'<span class="chip ok">Gepubliceerd</span>'}</td><td class="num">${x.lessons.length}</td><td><button class="btn sm ${x.id===mid?'primary':''}" data-a="cmod" data-v="${x.id}" ${x.stub?'disabled':''}>Prompts</button></td></tr>`).join('')}</table></div></div>
  <div class="tile"><div class="tile-h"><h2>Copilot-knoppen: ${esc(m.title)}</h2></div><form class="tile-b" data-form="prompts" data-v="${mid}"><p class="small muted">Kies welke vaste prompts medewerkers in deze module zien. De instructie achter elke knop bepaalt wat de Copilot doet.</p>
   ${Object.keys(PROMPT_INSTR).map(p=>`<label class="row" style="align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line-2)"><input type="checkbox" name="pr" value="${esc(p)}" ${lib.includes(p)?'checked':''} style="margin-top:4px"><span class="grow"><b>${esc(p)}</b><span class="small muted" style="display:block">${esc(PROMPT_INSTR[p].replace('{ROLE}',m.roleplay||''))}</span></span></label>`).join('')}
   <div class="form-actions"><button class="btn primary" type="submit">Publiceren</button></div></form></div></div>`; }
 if(tab==='campagnes') return `<div class="grid g2"><div class="tile"><div class="tile-h"><h2>Nieuwe oefencampagne</h2></div><form class="tile-b" data-form="campaign">
   <div class="field"><label for="ct">Sjabloon</label><select id="ct">${Object.entries(CAMPAIGN_TEMPLATES).map(([k,t])=>`<option value="${k}">${esc(t.n)} – “${esc(t.subj)}”</option>`).join('')}</select></div>
   <div class="field"><label for="cg">Doelgroep</label><select id="cg"><option>Team Mobiliteit &amp; Bereikbaarheid</option><option>Team Burgerzaken</option><option>Hele organisatie</option></select></div>
   <div class="field"><label>Leermoment bij klik</label><div class="small">Vriendelijke pagina “Dit was een oefening” met de herkenningspunten en een link naar de module.</div></div>
   <div class="notice warn small">Afgestemd met Informatiebeveiliging en de ondernemingsraad. Managers zien alleen teamtotalen; individuele kliks worden nergens getoond.</div>
   <div class="form-actions"><button class="btn primary" type="submit">${icon('send',14)} Nu versturen (demo)</button></div></form></div>
  <div class="tile"><div class="tile-h"><h2>Campagnes</h2></div><div class="tile-b scroll-x">${campaignTable()}</div></div></div>`;
 if(tab==='communities') return `<div class="tile"><div class="tile-b scroll-x"><table class="tbl"><tr><th>Community</th><th>Leden</th><th>Open vragen</th><th>Experts</th><th></th></tr>${COMMUNITIES.map((c,i)=>`<tr><td>${esc(c.n)}</td><td class="num">${c.leden}</td><td class="num">${c.id==='ov'?S.community.ov.qs.filter(q=>!q.ans.length).length:[2,1,0,3,1][i-1]??0}</td><td class="num">${[3,4,6,2,2,1][i]}</td><td><button class="btn sm" data-a="community" data-v="${c.id}">Modereren</button></td></tr>`).join('')}</table></div></div>`;
 return ''; }
function campaignTable(){ return `<table class="tbl num"><tr><th>Campagne</th><th>Doelgroep</th><th>Status</th><th>Geopend</th><th>Geklikt</th><th>Gemeld</th></tr>${S.campaigns.map(c=>{const r=c.res; return `<tr><td>${esc(CAMPAIGN_TEMPLATES[c.tpl].n)}</td><td>${esc(c.target)}</td><td><span class="chip ${c.status==='afgerond'?'ok':c.status==='actief'?'warn':''}">${c.status}</span></td>${r?`<td>${Math.round(r.open/r.sent*100)}%</td><td>${Math.round(r.click/r.sent*100)}%</td><td>${Math.round(r.report/r.sent*100)}%</td>`:'<td>–</td><td>–</td><td>–</td>'}</tr>`;}).join('')}</table>`; }

/* ============ MODAL ============ */
function modal(){ const [k,v]=S.modal; let inner='';
 if(k==='mission') inner=missionModal(v);
 if(k==='newws') inner=window.wsNewModal?wsNewModal(v):'';
 if(k==='feedback'){ const p=S.team.feed[v]; inner=`<div class="tile-h"><h2>Feedback voor ${esc(teamName(p.who))}</h2></div><form class="tile-b" data-form="feedback" data-v="${v}"><p class="small muted">“${esc(p.t)}”</p><div class="field"><label for="fbt">Je feedback</label><textarea id="fbt" required>Sterke tabel! Tip: noem eerst de absolute aantallen en dan pas de groei, dan leest het rustiger voor de raad.</textarea></div><div class="form-actions"><button type="button" class="btn" data-a="modal" data-v="">Annuleren</button><button class="btn primary" type="submit">Versturen</button></div></form>`; }
 return `<div class="modal-bg" data-a="modalbg"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`; }

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');
 if(!t){ if(S.pop && !e.target.closest('.pop')){ S.pop=null; render(); } return; }
 const a=t.dataset.a, v=t.dataset.v, u=U();
 if(a==='modalbg'){ if(e.target===t){ S.modal=null; render(); } return; }
 switch(a){
  case 'go': go(v,t.dataset.p?{p:t.dataset.p}:{}); break;
  case 'pop': S.pop=S.pop===v||!v?null:v; render(); break;
  case 'signal': { const s=u.signals.find(x=>String(x.id)===v); if(s){ s.read=true; const [vw,p]=s.go||['home']; if(vw==='module') go('module',{id:p}); else if(vw==='community') go('community',{id:p}); else go(vw,p?{p}:{}); } break; }
  case 'readall': u.signals.forEach(s=>s.read=true); save(); render(); break;
  case 'reset': try{localStorage.removeItem(LS_KEY);}catch(_){} S=initialState(); render(); note('Demo gereset','Alle accounts staan weer op de beginsituatie.'); break;
  case 'open': go('module',{id:v}); break;
  case 'filter': go('aanbod',{f:v}); break;
  case 'lesson': { const i=+v; if(i<0) return; S.params.l=i; u.progress[S.params.id].cur=i; save(); render(); window.scrollTo(0,0); break; }
  case 'quiz': { const m=MODULES[S.params.id]; const li=S.params.l??u.progress[m.id].cur; const k=`${u.id}-${m.id}-${li}`; const i=+v; const first=!(k in S.quizAns)&&!S.quizAns[k+'-tried']; S.quizAns[k]=i; if(i===m.lessons[li].quiz.c&&first){ addXP(m.domain,5,'Oefenvraag goed in één keer'); } S.quizAns[k+'-tried']=true; save(); render(); break; }
  case 'quizreset': { const m=MODULES[S.params.id]; const li=S.params.l??u.progress[m.id].cur; delete S.quizAns[`${u.id}-${m.id}-${li}`]; render(); break; }
  case 'finish': { const m=MODULES[S.params.id]; const p=u.progress[m.id]; const li=+v; if(!p.done.includes(li)){ p.done.push(li); addXP(m.domain,10,`Les “${m.lessons[li].t}” afgerond`); }
   if(p.done.length>=m.lessons.length){ setTimeout(()=>toast('Module afgerond',m.required?'Je certificaat is geregistreerd.':'Mooi werk!','plain'),300); if(m.id==='sec'&&u.id==='sanne'){ S.team.challenge.pctMod=Math.min(100,Math.round(secDoneCount()/9*100)); u.signals=u.signals.filter(s=>!s.t.includes('phishing herkennen')); } }
   else { p.cur=Math.min(li+1,m.lessons.length-1); S.params.l=p.cur; } save(); render(); window.scrollTo(0,0); break; }
  case 'qotd': { const k='qotd-'+u.id; const i=+v; const q=MODULES[t.dataset.m].lessons[+t.dataset.l].quiz; S.quizAns[k]=i; if(i===q.c) addXP(MODULES[t.dataset.m].domain,5,'Vraag van de dag goed'); else toast('Bedankt voor het meedoen','Morgen een nieuwe vraag.','plain'); save(); render(); break; }
  case 'mission': S.modal=['mission',v]; render(); break;
  case 'mstart': u.missions[v]='lopend'; S.modal=null; save(); render(); note('Missie gestart','Je vindt hem terug op Home en onder Missies.'); break;
  case 'modal': S.modal=null; render(); break;
  case 'tab': go('team',{p:v}); break;
  case 'ctab': go('community',{id:S.params.id,p:v}); break;
  case 'btab': go('beheer',{p:v}); break;
  case 'cmod': go('beheer',{p:'content',m:v}); break;
  case 'community': go('community',{id:v}); break;
  case 'like': S.team.feed[+v].likes++; save(); render(); break;
  case 'feedback': S.modal=['feedback',+v]; render(); break;
  case 'remind': note('Herinnering verstuurd',`${teamName(v)} krijgt een signaal in de Leer Academie.`); if(v==='sanne') addSignal('sanne','signaal','Herinnering van Mark: rond de verplichte phishingmodule af vóór 15 okt',['module','sec']); save(); break;
  case 'event': { const ev=S.community.ov.events[+v]; ev.me=!ev.me; ev.going+=ev.me?1:-1; save(); render(); if(ev.me) note('Aangemeld',`${ev.t} · ${ev.when}. Een agenda-uitnodiging volgt (in de echte versie via Outlook).`); break; }
  case 'mailsel': { S.inboxSel=v; const m=u.inbox.find(x=>x.id===v); if(m) m.read=true; save(); render(); break; }
  case 'report': { const m=u.inbox.find(x=>x.id===v); if(!m||m.reported) return; m.reported=true;
   if(m.phish){ u.phishReports++; addXP('sec',25,'Verdachte mail gemeld'); S.team.challenge.reports++; const r=campaignRes(); r.report++; S.campaigns.find(c=>c.id==='c1').res=r;
     if(u.phishReports>=3) badge('phish'); else setTimeout(()=>toast('Goed gezien! Dit was een oefenmail.',`Badge Phishing-speurder: ${u.phishReports}/3`),700);
     if(u.missions['M-04']!=='afgerond'){ u.missions['M-04']='afgerond'; setTimeout(()=>addXP('sec',50,'Missie “Meld het!” afgerond'),1400); } }
   else note('Melding ontvangen','Informatiebeveiliging kijkt ernaar. Deze mail was echt, maar melden bij twijfel is altijd goed.');
   save(); render(); break; }
  case 'lure': { S.lure=v; const r=campaignRes(); r.click++; S.campaigns.find(c=>c.id==='c1').res=r; save(); render(); window.scrollTo(0,0); break; }
  case 'lureclose': S.lure=null; render(); break;
  case 'copprompt': { const m=MODULES[S.params.id]; askCopilot(`[Knop: ${v}] ${(PROMPT_INSTR[v]||v).replace('{ROLE}',m.roleplay||'een kritische gesprekspartner')}`,v); break; }
  case 'copstop': copCtl?.abort(); break;
  case 'copclear': { const c=cop(S.params.id+'-'+S.user); c.turns=[]; save(); render(); break; }
  case 'copfb': { const c=cop(S.params.id+'-'+S.user); const tr=c.turns[+v]; tr.fb=t.dataset.k; S.copFeedback=S.copFeedback||{up:41,down:7}; S.copFeedback[t.dataset.k]++; save(); render(); break; }
  default: if(window.wsClick) wsClick(a,v,t,e); break;
  case 'copcopy': { const c=cop(S.params.id+'-'+S.user); const txt=c.turns[+v].content; if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>note('Gekopieerd')).catch(()=>note('Kopiëren lukte niet','Selecteer de tekst handmatig.')); break; }
 }
});
document.addEventListener('change',e=>{ const t=e.target; const k=t.dataset.change; if(!k) return;
 if(k==='acct'){ S.user=t.value; S.view='home'; S.params={}; S.lure=null; S.inboxSel=null; save(); render(); note(`Ingelogd als ${U().n}`,U().f); }
 if(k==='calm'){ S.calm=t.checked; save(); }
 if(k==='share'){ U().share=t.checked; save(); }
});
document.addEventListener('input',e=>{ if(e.target.dataset.input==='ask'){ const q=e.target.value.toLowerCase(); const box=document.getElementById('asksugg'); if(!box) return; const words=q.split(/\W+/).filter(w=>w.length>4); const hits=(S.community[S.params.id]?.qs||[]).filter(x=>words.some(w=>x.t.toLowerCase().includes(w))); const kb=(S.community[S.params.id]?.kb||[]).filter(x=>words.some(w=>x.t.toLowerCase().includes(w)));
 box.innerHTML=(hits.length||kb.length)?`<div class="notice small"><b>${icon('spark',14)} Copilot vond iets vergelijkbaars:</b><ul style="margin:4px 0 0;padding-left:18px">${hits.map(h=>`<li>Vraag: ${esc(h.t)}${h.ans.some(a=>a.best)?' (heeft een beste antwoord)':''}</li>`).join('')}${kb.map(k=>`<li>Kennisbank: ${esc(k.t)}</li>`).join('')}</ul></div>`:''; } });
document.addEventListener('keydown',e=>{ if(window.wsKey&&wsKey(e)) return; if(e.key==='Escape'&&(S.modal||S.pop)){ S.modal=null; S.pop=null; render(); }
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cop-input'){ e.preventDefault(); e.target.form.requestSubmit(); } });
document.addEventListener('submit',e=>{ const f=e.target; const k=f.dataset.form; if(!k) return; e.preventDefault(); const u=U(); const val=id=>(document.getElementById(id)?.value||'').trim();
 if(k==='search'){ go('aanbod',{q:val('q')}); }
 if(window.wsSubmit&&wsSubmit(k,f,val)) return;
 if(k==='cop'){ const x=val('cop-input'); if(!x) return; document.getElementById('cop-input').value=''; askCopilot(x); }
 if(k==='mission'){ const id=f.dataset.v; const m=MISSIONS.find(x=>x.id===id); u.missions[id]='afgerond'; S.modal=null; addXP(m.d,m.xp,`Missie “${m.t}” afgerond`); const who=val('r3');
  if(who){ note('Feedback gevraagd',`${teamName(who)} krijgt een taak om feedback te geven.`); }
  if(u.share) S.team.feed.unshift({who:u.id,t:`Missie “${m.t}” afgerond. ${val('r2')}`,when:'zojuist',likes:0,kind:'missie'});
  if(id==='M-01'&&u.id==='sanne'){ S.team.goal.done=Math.min(S.team.goal.of,S.team.goal.done+1); }
  save(); render(); }
 if(k==='feedback'){ S.modal=null; addXP('ov',20,'Feedback gegeven aan een collega'); save(); render(); note('Feedback verstuurd',`${teamName(S.team.feed[+f.dataset.v].who)} ziet je feedback bij haar missie.`); }
 if(k==='post'){ const x=val('post-text'); if(!x) return; S.team.feed.unshift({who:u.id,t:x,when:'zojuist',likes:0,kind:'tip'}); document.getElementById('post-text').value=''; save(); render(); }
 if(k==='minute'){ S.team.minutes.items.unshift({when:'vandaag',q:[val('m1'),val('m2'),val('m3')]}); S.team.feed.unshift({who:u.id,t:`Leerminuut: ${val('m2')} Volgende keer: ${val('m3')}`,when:'zojuist',likes:0,kind:'leerminuut'}); save(); render(); note('Leerminuut vastgelegd','De lessen staan in de teamfeed.'); }
 if(k==='recommend'){ const mod=val('rm'); const kind=val('rk'); const who=[...f.querySelectorAll('input[name=who]:checked')].map(x=>x.value); if(!who.length) return note('Kies minimaal één teamlid');
  who.forEach(w=>{ if(w==='sanne'){ S.recommendations=S.recommendations.filter(r=>!(r.to==='sanne'&&r.mod===mod)); S.recommendations.push({to:'sanne',mod,by:'Mark Janssen',msg:val('rmsg')}); addSignal('sanne',kind==='toewijzen'?'taak':'signaal',`Mark heeft je “${MODULES[mod].title}” ${kind==='toewijzen'?'toegewezen':'aangeraden'}`,['module',mod]); } });
  save(); note(kind==='toewijzen'?'Toegewezen':'Aangeraden',`${MODULES[mod].title} → ${who.length} teamleden. Zij krijgen een signaal.`); }
 if(k==='prompts'){ const mid=f.dataset.v; S.promptLib=S.promptLib||{}; S.promptLib[mid]=[...f.querySelectorAll('input[name=pr]:checked')].map(x=>x.value); save(); note('Gepubliceerd',`De Copilot-knoppen van ${MODULES[mid].title} zijn bijgewerkt.`); }
 if(k==='campaign'){ const tpl=val('ct'); const tg=val('cg'); const T=CAMPAIGN_TEMPLATES[tpl]; let c=S.campaigns.find(c=>c.id==='c1'); c.tpl=tpl; c.target=tg; c.status='actief'; c.when='vandaag'; c.res={sent:9,open:4,click:1,report:2};
  ['sanne','mark'].forEach(uid=>{ const ib=S.users[uid].inbox; if(!ib.some(m=>m.phish)) ib.unshift({id:'p'+Date.now()+uid,from:T.from,addr:T.addr,subj:T.subj,time:'zojuist',read:false,phish:tpl,body:T.body}); });
  save(); render(); note('Campagne verstuurd',`De oefenmail staat nu in de inbox van ${tg}. Wissel naar Sanne en open Veilig werken.`); }
});
</script>
<script>

 'ws/inbreng':{title:'Inbreng busconcessie West-Brabant',desc:'Samen werken aan de inbreng van Breda voor het programma van eisen.',community:'ov',members:['Sanne de Vries','Iris van Dijk','Noor Bakker','Ruben Koster'],created:'20 sep 2026'},
 'wsdoc/inbreng':{title:'Inbreng gemeente Breda – concept v0.3',updatedBy:'Iris van Dijk',updatedAt:0,html:`<h1>Inbreng gemeente Breda voor de busconcessie West-Brabant</h1><p><i>Concept v0.3 · werkgroep Mobiliteit &amp; Bereikbaarheid · fictieve demo-inhoud</i></p><h2>1. Beslispunt</h2><p>Het college stelt de inbreng van Breda voor het programma van eisen van de nieuwe busconcessie vast en biedt deze aan de provincie aan.</p><h2>2. Kern van onze inbreng</h2><ul><li>Minimaal elke 15 minuten een bus op de corridors Noord en Oost, op werkdagen tussen 7.00 en 19.00 uur.</li><li>Kleine kernen blijven bereikbaar met minimaal een uurdienst of een goed alternatief, zoals een buurtbus of vraagafhankelijk vervoer.</li><li>Alle haltes op de hoofdlijnen zijn toegankelijk.</li><li>Zero-emissiebussen vanaf de start van de concessie.</li></ul><h2>3. Onderbouwing</h2><p>Station Noord heeft ruim 1.800 instappers per dag en de grootste woningbouwopgave tot 2030 (650 woningen). Bedrijventerrein Hazeldonk groeit hard (+21%), maar vanaf een laag niveau.</p><h2>4. Afweging</h2><p>[Iris: hier de afweging tussen snelle lijnen en bereikbaarheid van kleine kernen uitwerken.]</p><h2>5. Wat betekent dit voor inwoners?</h2><p>[Nog invullen]</p>`},
 'wsslides/inbreng':{title:'Pitch stuurgroep OV – 14 okt',slides:[
  {title:'Inbreng Breda – busconcessie West-Brabant',body:'<p>Stuurgroep OV · 14 oktober 2026</p><p>Team Mobiliteit &amp; Bereikbaarheid</p>'},
  {title:'Wat vragen we?',body:'<ul><li>Kwartierdienst op de corridors Noord en Oost</li><li>Kleine kernen blijven bereikbaar</li><li>Toegankelijke haltes op de hoofdlijnen</li><li>Zero-emissie vanaf dag 1</li></ul>'},
  {title:'Waarom?',body:'<ul><li>Station Noord: 1.840 instappers per dag (+12%)</li><li>650 nieuwe woningen tot 2030</li><li>Hazeldonk groeit hard (+21%)</li></ul>'},
  {title:'Wat doet de gemeente zelf?',body:'<ul><li>Doorstroming op kruispunten verbeteren</li><li>Fietsenstallingen bij knooppunten</li><li>Haltes toegankelijk maken</li></ul>'}]},
 'wsboard/inbreng':{title:'Brainstorm: kleine kernen bereikbaar',notes:{

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(a,b){ const out=Array.isArray(a)||typeof a!=='object'||a===null?{}:{...a}; for(const k in b){ const v=b[k]; out[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&out[k]&&typeof out[k]==='object'&&!Array.isArray(out[k]))?deepMerge(out[k],v):v; } return out; }
function localData(){ if(!S.wsLocal) S.wsLocal=clone(WS_DEFAULTS); return S.wsLocal; }
const store={
 sub(path,cb){ if(WS.db){ return WS.db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null),e=>{ console.warn('db',e); }); }
  (WS.local[path]=WS.local[path]||[]).push(cb); setTimeout(()=>cb(localData()[path]||null),0); return ()=>{ WS.local[path]=(WS.local[path]||[]).filter(f=>f!==cb); }; },
 write(path,data,merge){ if(WS.db){ const ref=WS.db.doc(path); WS.q[path]=(WS.q[path]||Promise.resolve()).then(()=>merge?ref.update(data).catch(e=>{ if(e&&e.code==='invalid_argument') return ref.set(data); throw e; }):ref.set(data)).catch(e=>{ console.warn(e); note('Opslaan lukte niet','Je wijziging is niet gedeeld. Probeer het opnieuw.'); }); return WS.q[path]; }
  const L=localData(); L[path]=merge&&L[path]?deepMerge(L[path],data):clone(data); save(); (WS.local[path]||[]).forEach(f=>f(L[path])); if(path.startsWith('ws/')) refreshLocalList(); return Promise.resolve(); }
};

function listSubscribe(){ if(WS.db){ WS.db.collection('ws').onSnapshot(snap=>{ WS.list={}; snap.docs.forEach(d=>{ WS.list[d.id]=d.data(); }); if((S.view==='community'&&S.params.p==='werkruimtes')||S.view==='werkruimtes') render(); },e=>console.warn(e)); } else refreshLocalList(); }

function paintDoc(remote){ const p=document.getElementById('paper'); if(!p) return; const d=WS.cache['wsdoc/'+S.params.ws]; if(!d) return;
 if(document.activeElement!==p&&p.innerHTML!==d.html){ p.innerHTML=d.html||'<p></p>'; if(remote&&d.updatedBy&&d.updatedBy!==U().n) setStatus(`Bijgewerkt door ${d.updatedBy}`); }
 else if(document.activeElement===p&&remote&&d.html!==p.innerHTML&&d.updatedBy!==U().n) setStatus(`${d.updatedBy} heeft ook bewerkt. Klik buiten de tekst om te verversen.`);
 const last=document.getElementById('doc-last'); if(last) last.textContent=d.updatedBy?`${d.updatedBy}${d.updatedAt?' · '+new Date(d.updatedAt).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}`:'–';

});

function boardPoint(e){ const b=document.getElementById('board').getBoundingClientRect(); return {x:Math.round(e.clientX-b.left),y:Math.round(e.clientY-b.top)}; }

/* ---- Copilot in werkruimte ---- */
async function wsCopilot(action){ const out=document.getElementById('ws-cop-out'); if(!out) return; if(!SAMPLE){ out.innerHTML='<p>De AI-Copilot staat in deze online demo uit.</p>'; return; }
 const {ws,kind}=S.params; out.innerHTML='<span class="thinking"><i></i><i></i><i></i></span> <span class="small muted">Copilot denkt na…</span>';
 const base='Je bent de Leer-Copilot van Leer Academie Breda (gemeente Breda) en helpt een team in een gedeelde werkruimte. Antwoord in helder Nederlands op B1-niveau, kort en concreet (max. 180 woorden), met korte opsommingen. Verzin geen cijfers; de inhoud is fictieve demo-inhoud.\n\n';
 try{
  if(kind==='slides'&&action==="Maak dia's van het document"){
   const docPath='wsdoc/'+ws; let doc=WS.cache[docPath]; if(!doc){ doc=await new Promise(res=>{ let u=null; u=store.sub(docPath,d=>{ res(d||{}); setTimeout(()=>u&&u(),0); }); }); }
   const txt=strip(doc.html||'').slice(0,8000); if(!txt){ out.innerHTML='<p>Er staat nog geen document in deze werkruimte.</p>'; return; }
   const arr=await SAMPLE.json(base+'Maak van het document hieronder 4 tot 6 presentatiedia\'s voor een stuurgroep. Antwoord met alleen een JSON-array van objecten {"title": string, "bullets": [string]} met maximaal 4 korte bullets per dia. Voorbeeld: [{"title":"Wat vragen we?","bullets":["Kwartierdienst op corridor Noord"]}]\n\nDocument:\n'+txt);
   if(!Array.isArray(arr)||!arr.length) throw {code:'invalid_json'};
   const d=WS.cache['wsslides/'+ws]; WS.undoSlides=clone(d.slides); d.slides=arr.slice(0,8).map(s=>({title:String(s.title||''),body:'<ul>'+(Array.isArray(s.bullets)?s.bullets:[]).slice(0,6).map(b=>`<li>${esc(String(b))}</li>`).join('')+'</ul>'}));
   WS.slideIdx=0; saveSlides(); paintSlides(false); out.innerHTML=`<p>${arr.length} dia's gemaakt op basis van het document. Pas ze gerust aan.</p>`; document.getElementById('ws-undo').innerHTML='<button class="btn sm" data-a="ws-sl" data-v="undo">Ongedaan maken</button>'; return; }
  let ctx='';
  if(kind==='doc'){ const p=document.getElementById('paper'); ctx='Document:\n'+(p?p.innerText:'').slice(0,12000); }
  if(kind==='slides'){ const d=WS.cache['wsslides/'+ws]; const s=d.slides[WS.slideIdx]; ctx=`Huidige dia (${WS.slideIdx+1}): ${s.title}\n${strip(s.body)}\n\nAlle dia's:\n`+d.slides.map((x,i)=>`${i+1}. ${x.title}: ${strip(x.body)}`).join('\n'); }
  if(kind==='board') ctx='Stickies op het whiteboard (zone bepaald door x-positie: Ideeën <400, Kansen <800, Zorgen <1200, Acties daarboven):\n'+notesOf().map(([,n])=>`- [${ZONES.slice().reverse().find(z=>n.x>=z[1]-20)?.[0]||'Ideeën'}] ${n.text} (${n.votes||0} stemmen, ${n.by})`).join('\n');
  const task={ 'Vat samen':'Vat het document samen in 5 bullets voor een wethouder.','Maak B1':'Geef de 5 zinnen uit het document die het minst helder zijn, elk met een B1-versie ernaast.','Zoek tegenargumenten':'Geef 3 sterke tegenargumenten die een raadslid of de provincie tegen deze inbreng kan inbrengen, elk met een kort antwoord.','Wat ontbreekt nog?':'Welke onderdelen of onderbouwing ontbreken nog in dit document? Maximaal 5 punten.','Sprekersnotities':'Schrijf korte sprekersnotities (max. 80 woorden) voor de huidige dia.','Vat de brainstorm samen':'Vat de brainstorm samen per zone en noem de ideeën met de meeste stemmen.','Maak actiepunten':'Maak 3 tot 5 concrete actiepunten uit deze brainstorm, met een voorstel voor wie (rol) het oppakt.','Welke ideeën ontbreken?':'Welke 3 ideeën of zorgen ontbreken nog op het bord? Kort toelichten.'}[action]||action;
  const {text}=await SAMPLE(base+task+'\n\n'+ctx,{cache:false,onText:({text})=>{ const o=document.getElementById('ws-cop-out'); if(o) o.innerHTML=md(text); }});
  const o=document.getElementById('ws-cop-out'); if(o) o.innerHTML=md(text)+(kind==='board'&&action==='Maak actiepunten'?'<button class="btn sm" data-a="ws-toacts">Zet als stickies in Acties</button>':'');
  WS.lastCop=text;
 }catch(e){ const o=document.getElementById('ws-cop-out'); if(o) o.innerHTML=`<p style="color:var(--bad)">${e&&e.code==='not_granted'?'Je hebt de Copilot geen toestemming gegeven.':e&&e.code==='rate_limited'?'Het is even te druk. Probeer het zo opnieuw.':'Dat lukte niet. Probeer het opnieuw.'}</p>`; if(e&&['not_granted','sampling_disabled'].includes(e.code)) SAMPLE=null; } }

function wsClick(a,v,t,e){ const ws=S.params.ws;
 switch(a){
  case 'ws-new': S.modal=['newws',v]; render(); break;
  case 'ws-open': go('wsitem',{ws:v,kind:t.dataset.k}); break;
  case 'ws-join': { const w=WS.list[v]||WS.cache['ws/'+v]; if(!w) return; const members=[...new Set([...(w.members||[]),U().n])]; w.members=members; store.write('ws/'+v,{members},true).then(()=>{ note('Je doet mee',`Je bent lid van “${w.title}”.`); render(); }); break; }
  case 'ws-fmt': { const p=document.getElementById('paper'); if(!p) return; p.focus(); const cmd={bold:['bold'],italic:['italic'],underline:['underline'],ul:['insertUnorderedList'],ol:['insertOrderedList'],undo:['undo'],redo:['redo'],h1:['formatBlock','<h1>'],h2:['formatBlock','<h2>'],p:['formatBlock','<p>'],hilite:['hiliteColor','#FFF3A0']}[v]; if(cmd){ document.execCommand(cmd[0],false,cmd[1]); p.dispatchEvent(new Event('input',{bubbles:true})); } break; }
  case 'ws-cop': wsCopilot(v); break;
  case 'ws-slide': WS.slideIdx=+v; paintSlides(false); break;
  case 'ws-sl': { const d=WS.cache['wsslides/'+ws]; if(!d) return; const i=WS.slideIdx;
   if(v==='add'){ d.slides.splice(i+1,0,{title:'Nieuwe dia',body:'<ul><li>Punt</li></ul>'}); WS.slideIdx=i+1; }
   if(v==='dup'){ d.slides.splice(i+1,0,clone(d.slides[i])); WS.slideIdx=i+1; }
   if(v==='del'){ if(d.slides.length<2) return note('Een presentatie heeft minimaal één dia'); d.slides.splice(i,1); WS.slideIdx=Math.max(0,i-1); }
   if(v==='up'&&i>0){ [d.slides[i-1],d.slides[i]]=[d.slides[i],d.slides[i-1]]; WS.slideIdx=i-1; }
   if(v==='down'&&i<d.slides.length-1){ [d.slides[i+1],d.slides[i]]=[d.slides[i],d.slides[i+1]]; WS.slideIdx=i+1; }
   if(v==='bul'){ const b=document.querySelector('#slide .s-body'); b.focus(); document.execCommand('insertUnorderedList'); b.dispatchEvent(new Event('input',{bubbles:true})); return; }
   if(v==='present'){ WS.presenting=true; paintPresent(); return; }
   if(v==='undo'){ if(WS.undoSlides){ d.slides=WS.undoSlides; WS.undoSlides=null; document.getElementById('ws-undo').innerHTML=''; } }
   saveSlides(); paintSlides(false); break; }
  case 'ws-pv': { const d=WS.cache['wsslides/'+ws]; if(v==='x'){ WS.presenting=false; paintPresent(); paintSlides(false); return; } WS.slideIdx=Math.max(0,Math.min(d.slides.length-1,WS.slideIdx+(+v))); paintPresent(); break; }
  case 'ws-color': WS.color=v; document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.v===v)); break;
  case 'ws-note': { const sc=document.getElementById('board-scroll'); const id='n'+Date.now().toString(36); const x=Math.min(1400,Math.round(sc.scrollLeft+sc.clientWidth/2-85)), y=Math.min(860,Math.round(sc.scrollTop+sc.clientHeight/2-55)); const n={x,y,text:'Nieuw idee',color:WS.color,votes:0,by:U().n}; const path='wsboard/'+ws; WS.cache[path]=WS.cache[path]||{notes:{}}; WS.cache[path].notes=WS.cache[path].notes||{}; WS.cache[path].notes[id]=n; paintBoard(); store.write(path,{notes:{[id]:n}},true);
   setTimeout(()=>{ const el=document.querySelector(`.sticky[data-id="${id}"]`); if(el) el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true})); },50); break; }
  case 'ws-vote': { const path='wsboard/'+ws; const n=WS.cache[path]?.notes?.[v]; if(!n) return; n.votes=(n.votes||0)+1; paintBoard(); store.write(path,{notes:{[v]:{votes:n.votes}}},true); break; }
  case 'ws-ndel': { const path='wsboard/'+ws; if(WS.cache[path]?.notes) WS.cache[path].notes[v]=null; paintBoard(); store.write(path,{notes:{[v]:null}},true); break; }
  case 'ws-toacts': { const lines=(WS.lastCop||'').split('\n').map(l=>l.replace(/^\s*(\d+[.)]|[-*•])\s+/,'').replace(/\*\*/g,'').trim()).filter(l=>l.length>8).slice(0,5); const path='wsboard/'+ws; const add={}; lines.forEach((l,i)=>{ add['a'+Date.now().toString(36)+i]={x:1240+(i%2)*185,y:370+Math.floor(i/2)*140,text:l.slice(0,140),color:'blue',votes:0,by:'Copilot'}; }); WS.cache[path].notes={...WS.cache[path].notes,...add}; paintBoard(); store.write(path,{notes:add},true); note('Actiepunten toegevoegd',`${lines.length} stickies in de zone Acties.`); break; }
 }
}
function wsKey(e){ if(!WS.presenting) return false; if(e.key==='Escape'){ WS.presenting=false; paintPresent(); paintSlides(false); return true; } if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); wsClick('ws-pv','1'); return true; } if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); wsClick('ws-pv','-1'); return true; } return false; }
function wsNewModal(cid){ return `<div class="tile-h"><h2>Nieuwe werkruimte</h2></div><form class="tile-b" data-form="newws" data-v="${esc(cid)}"><div class="field"><label for="nw-t">Naam</label><input id="nw-t" required value="Toegankelijke haltes"></div><div class="field"><label for="nw-d">Waar werken jullie aan?</label><textarea id="nw-d">Samen een voorstel maken voor toegankelijke haltes op de hoofdlijnen.</textarea></div><p class="small muted">Je krijgt direct een gedeeld document, een presentatie en een whiteboard.</p><div class="form-actions"><button type="button" class="btn" data-a="modal" data-v="">Annuleren</button><button class="btn primary" type="submit">Aanmaken</button></div></form>`; }

 WS.list[id]=w; S.modal=null;
 Promise.all([store.write('ws/'+id,w,false),store.write('wsdoc/'+id,{title:title+' – concept',html:`<h1>${esc(title)}</h1><p>${esc(val('nw-d'))}</p><h2>Aanleiding</h2><p></p><h2>Voorstel</h2><p></p>`,updatedBy:me,updatedAt:Date.now()},false),store.write('wsslides/'+id,{title:title,slides:[{title,body:'<p>'+esc(me)+'</p>'},{title:'Wat willen we bereiken?',body:'<ul><li></li></ul>'}]},false),store.write('wsboard/'+id,{title:'Brainstorm: '+title,notes:{}},false)])

 communities:[{el:q('.main .grid .tile'),title:'Een community',text:'Vakgenoten van alle afdelingen. Open een community voor vragen, werkruimtes, kennisbank en events.'}],
 community:[{el:q('.tabs'),title:'Onderdelen',text:'Stel vragen, werk samen in werkruimtes, vind documenten in de kennisbank en meld je aan voor events.',place:'bottom'}],
 werkruimtes:[{el:q('.ws-card'),title:'Werkruimte',text:'Klik op Deelnemen om mee te doen. Open daarna het document, de presentatie of het whiteboard.'}],
 wsitem:[{el:q('.ws-head'),title:'Samen werken',text:'Rechts zie je wie er nu aanwezig is. Wijzigingen worden automatisch opgeslagen en gedeeld.',place:'bottom'},{el:q('.ws-side'),title:'Copilot in de werkruimte',text:'Laat de Copilot samenvatten, tegenargumenten zoeken of actiepunten maken.',place:'left'}],
 veilig:[{el:q('.inbox'),title:'Oefen-inbox',text:'Open een mail. Twijfel je? Gebruik de rode knop Meld phishing.'}],
 beheer:[{el:q('.tabs'),title:'Beheer',text:'Dashboard, content en Copilot-knoppen, campagnes en communities.',place:'bottom'}],
 home:null
};
function roleTour(){ const r=U().role; return r==='manager'?TOURS.manager:r==='lo'?TOURS.lo:TOURS.medewerker; }
function helpUI(){
 let fab=document.getElementById('help-fab'); if(!fab){ fab=document.createElement('button'); fab.id='help-fab'; fab.className='help-fab'; fab.setAttribute('aria-label','Hulp: Wat kan ik voor je doen?'); fab.setAttribute('aria-haspopup','true'); fab.innerHTML=icon('chat',24); fab.dataset.tourA='menu'; document.body.appendChild(fab); }
 fab.setAttribute('aria-expanded',T.menu?'true':'false'); fab.hidden=T.on;
 let m=document.getElementById('help-menu'); if(m) m.remove(); let h=document.getElementById('help-hint'); if(h) h.remove();
 if(T.menu&&!T.on){ m=document.createElement('div'); m.id='help-menu'; m.className='help-menu'; m.setAttribute('role','menu');
  const ph=PAGE_HELP[S.view]; const roleName={medewerker:'medewerker',manager:'teammanager',lo:'Leren & Ontwikkelen'}[U().role];
  m.innerHTML=`<h3>Hulp</h3><p class="sub">Ingelogd als ${esc(U().n)} (${roleName})</p>
   <button class="hm" data-tour-a="start" role="menuitem"><i>${icon('play',18)}</i><div><b>Rondleiding door het platform</b><span>${roleTour().length} stappen · ongeveer 1 minuut</span></div></button>
   ${ph?`<button class="hm" data-tour-a="page" role="menuitem"><i>${icon('help',18)}</i><div><b>Uitleg bij deze pagina</b><span>${ph.length} korte tips</span></div></button>`:''}
   <button class="hm" data-tour-a="copilot" role="menuitem"><i>${icon('spark',18)}</i><div><b>Vraag het de Copilot</b><span>Open een module en stel je vraag</span></div></button>`;
  document.body.appendChild(m); }
 const seen=(S.tourSeen||{})[S.user];
 if(!T.on&&!T.menu&&!seen&&!S.modal){ h=document.createElement('div'); h.id='help-hint'; h.className='help-hint'; h.innerHTML=`<span>Nieuw hier? Volg de korte rondleiding.</span><button class="go" data-tour-a="start">Start</button><button data-tour-a="dismiss" aria-label="Sluiten">${icon('dismiss',16)}</button>`; document.body.appendChild(h); }
}
function markSeen(){ S.tourSeen=S.tourSeen||{}; S.tourSeen[S.user]=true; save(); }
function tourStart(steps,name){ T.steps=steps; T.i=0; T.on=true; T.menu=false; T.name=name; markSeen(); helpUI(); tourShow(); }
function tourEnd(){ T.on=false; ['tour-block','tour-hole','tour-tip'].forEach(id=>document.getElementById(id)?.remove()); helpUI(); }
function tourGo(step){ if(!step.go) return false; const [v,p]=step.go; const same=S.view===v&&(!p||Object.entries(p).every(([k,val])=>S.params[k]===val)); if(same) return false; go(v,p||{}); return true; }
function tourShow(){ const s=T.steps[T.i]; if(!s) return tourEnd(); const moved=tourGo(s); setTimeout(()=>tourPaint(s), moved?120:0); }
function tourPaint(s){
 let block=document.getElementById('tour-block'), hole=document.getElementById('tour-hole'), tip=document.getElementById('tour-tip');
 if(!block){ block=document.createElement('div'); block.id='tour-block'; block.className='tour-block'; document.body.appendChild(block); }
 if(!hole){ hole=document.createElement('div'); hole.id='tour-hole'; hole.className='tour-hole center'; document.body.appendChild(hole); }
 if(!tip){ tip=document.createElement('div'); tip.id='tour-tip'; tip.className='tour-tip'; tip.setAttribute('role','dialog'); tip.setAttribute('aria-live','polite'); document.body.appendChild(tip); }
 const el=s.el?s.el():null; const n=T.steps.length;
 tip.className='tour-tip'+(s.big||!el?' big':'');
 tip.innerHTML=`<div class="eyebrow">${esc(T.name)} · stap ${T.i+1} van ${n}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
  <div class="tour-prog" aria-hidden="true"><i style="width:${Math.round((T.i+1)/n*100)}%"></i></div>
  <div class="foot">${T.i<n-1?'<button class="skip" data-tour-a="end">Rondleiding overslaan</button>':'<span></span>'}
  <div class="row" style="gap:6px">${T.i>0?'<button class="btn sm" data-tour-a="prev">Vorige</button>':''}<button class="btn sm primary" data-tour-a="next">${T.i<n-1?'Volgende':'Afronden'}</button></div></div>`;
 if(el){ el.scrollIntoView({block:'center',inline:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
 setTimeout(()=>tourPlace(el,s),el?260:0);
 setTimeout(()=>tip.querySelector('[data-tour-a="next"]')?.focus({preventScroll:true}),300);
}
function tourPlace(el,s){ const hole=document.getElementById('tour-hole'), tip=document.getElementById('tour-tip'); if(!hole||!tip) return;
 const vw=innerWidth, vh=innerHeight, tw=tip.offsetWidth, th=tip.offsetHeight, pad=8, gap=14;
 if(!el){ hole.classList.add('center'); hole.style.cssText=''; tip.style.left=Math.max(16,(vw-tw)/2)+'px'; tip.style.top=Math.max(16,(vh-th)/2)+'px'; return; }
 hole.classList.remove('center'); const r=el.getBoundingClientRect();
 const x=Math.max(4,r.left-pad), y=Math.max(4,r.top-pad), w=Math.min(vw-8,r.width+pad*2), h=Math.min(vh-8,r.height+pad*2);
 Object.assign(hole.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 const fits={right:x+w+gap+tw<vw-8,left:x-gap-tw>8,bottom:y+h+gap+th<vh-8,top:y-gap-th>8};
 const order=[s.place||'bottom','bottom','right','left','top'].filter((v,i,a)=>a.indexOf(v)===i);
 const p=order.find(o=>fits[o]);
 let L,Tp;
 if(p==='right'){ L=x+w+gap; Tp=y; } else if(p==='left'){ L=x-gap-tw; Tp=y; } else if(p==='top'){ L=x; Tp=y-gap-th; } else if(p==='bottom'){ L=x; Tp=y+h+gap; } else { L=(vw-tw)/2; Tp=vh-th-24; }
 tip.style.left=Math.min(Math.max(16,L),vw-tw-16)+'px'; tip.style.top=Math.min(Math.max(16,Tp),vh-th-16)+'px'; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-tour-a]'); if(!b){ if(T.menu&&!e.target.closest('#help-menu')){ T.menu=false; helpUI(); } return; }
 e.stopPropagation(); const a=b.dataset.tourA;
 if(a==='menu'){ T.menu=!T.menu; helpUI(); }
 if(a==='start'){ tourStart(roleTour(),'Rondleiding'); }
 if(a==='page'){ const ph=PAGE_HELP[S.view]; if(ph) tourStart(ph,'Uitleg bij deze pagina'); }
 if(a==='copilot'){ T.menu=false; helpUI(); go('module',{id:'ov'}); setTimeout(()=>document.getElementById('cop-input')?.focus(),150); }
 if(a==='dismiss'){ markSeen(); helpUI(); }
 if(a==='next'){ if(T.i<T.steps.length-1){ T.i++; tourShow(); } else tourEnd(); }
 if(a==='prev'){ if(T.i>0){ T.i--; tourShow(); } }
 if(a==='end'){ tourEnd(); }
},true);
document.addEventListener('keydown',e=>{ if(!T.on){ if(e.key==='Escape'&&T.menu){ T.menu=false; helpUI(); } return; }
 if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); tourEnd(); }
 else if(e.key==='ArrowRight'){ e.preventDefault(); e.stopImmediatePropagation(); if(T.i<T.steps.length-1){T.i++; tourShow();} else tourEnd(); }
 else if(e.key==='ArrowLeft'){ e.preventDefault(); e.stopImmediatePropagation(); if(T.i>0){T.i--; tourShow();} } },true);
addEventListener('resize',()=>{ if(T.on){ const s=T.steps[T.i]; tourPlace(s.el?s.el():null,s); } });
addEventListener('scroll',()=>{ if(T.on){ const s=T.steps[T.i]; tourPlace(s.el?s.el():null,s); } },{passive:true});
document.addEventListener('change',e=>{ if(e.target.dataset.change==='acct'){ T.menu=false; if(T.on) tourEnd(); setTimeout(helpUI,0); } });
const _render=render; render=function(){ _render(); if(!T.on) helpUI(); };
helpUI();
</script>

<script>
// Dark theme switch in the profile menu
document.addEventListener('change',e=>{ if(e.target.dataset.change!=='theme') return; const t=e.target.checked?'dark':'light'; document.documentElement.dataset.theme=t; try{ localStorage.setItem('lab-theme',t); }catch(err){} });
</script>
